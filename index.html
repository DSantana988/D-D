<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dados y Dragones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Juego de rol de fantasía en solitario con reglas de 5.ª edición y Claude como Dungeon Master.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&family=Grenze+Gotisch:wght@400;600&display=swap">
<style>
/* Mesa del DM a la luz de una antorcha: narración a la izquierda, ficha a la derecha, tablero de piedra en combate */
:root {
  color-scheme: dark;
  --fondo: #12141a;
  --sup: #1a1d26;
  --sup-2: #222633;
  --sup-3: #2c3142;
  --linea: #323848;
  --linea-2: #474e63;
  --texto: #ede5d3;
  --texto-2: #bdb5a4;
  --texto-3: #8e8879;
  --antorcha: #e9a23b;
  --antorcha-2: #f7c56b;
  --antorcha-fondo: rgba(233, 162, 59, 0.12);
  --tinta-boton: #22170a;
  --sangre: #e2565e;
  --sangre-fondo: rgba(226, 86, 94, 0.13);
  --vida: #63c290;
  --vida-fondo: rgba(99, 194, 144, 0.13);
  --arcano: #a896f6;
  --arcano-fondo: rgba(168, 150, 246, 0.14);
  --oro: #f3c75a;
  --f-display: 'Grenze Gotisch', 'UnifrakturMaguntia', Georgia, serif;
  --f-texto: 'Alegreya', Georgia, 'Times New Roman', serif;
  --f-ui: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --f-sc: 'Alegreya Sans SC', 'Alegreya Sans', system-ui, sans-serif;
  --radio: 8px;
  --gutter-izq: max(16px, env(safe-area-inset-left, 0px));
  --gutter-der: max(16px, env(safe-area-inset-right, 0px));
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background:
    radial-gradient(1100px 560px at 8% -12%, rgba(233, 162, 59, 0.085), transparent 62%),
    radial-gradient(900px 520px at 108% 112%, rgba(168, 150, 246, 0.06), transparent 60%),
    var(--fondo);
  background-attachment: fixed;
  color: var(--texto);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sup); }
#app { min-height: 100%; }
body[data-pantalla="juego"] #app { height: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--antorcha-2); outline-offset: 2px; }
p { margin: 0 0 0.6em; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
small { color: var(--texto-3); }
b, strong { font-weight: 700; }

/* ── Botones y campos ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45em;
  padding: 0.55em 1em; border-radius: var(--radio);
  border: 1px solid var(--linea-2); background: var(--sup-2); color: var(--texto);
  font-family: var(--f-ui); font-weight: 600; font-size: 0.95rem; line-height: 1.2;
  cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.08s;
  text-align: left;
}
.btn:hover:not(:disabled) { border-color: var(--antorcha); background: var(--sup-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primario { background: var(--antorcha); border-color: var(--antorcha); color: var(--tinta-boton); }
.btn-primario:hover:not(:disabled) { background: var(--antorcha-2); border-color: var(--antorcha-2); }
.btn-fantasma { background: transparent; border-color: transparent; color: var(--texto-2); }
.btn-fantasma:hover:not(:disabled) { background: var(--sup-2); }
.btn-mini { padding: 0.32em 0.7em; font-size: 0.85rem; }
.btn.activo { border-color: var(--antorcha); background: var(--antorcha-fondo); color: var(--antorcha-2); }
.btn-destacado { border-color: var(--oro); color: var(--oro); }
.btn-grande { flex-direction: column; align-items: flex-start; padding: 0.9em 1.3em; font-size: 1.08rem; min-width: 250px; }
.btn-grande small { font-weight: 400; color: inherit; opacity: 0.78; font-size: 0.82rem; }
.btn-icono { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--radio); border: 1px solid transparent; background: transparent; color: var(--texto-2); cursor: pointer; font-size: 1rem; }
.btn-icono:hover:not(:disabled) { border-color: var(--linea-2); color: var(--texto); }
.btn-icono:disabled { opacity: 0.35; cursor: not-allowed; }
.campo {
  width: 100%; box-sizing: border-box; padding: 0.55em 0.75em; border-radius: var(--radio);
  border: 1px solid var(--linea-2); background: var(--fondo); color: var(--texto);
  font-family: var(--f-ui); font-size: 0.98rem;
}
.campo:focus { border-color: var(--antorcha); outline: none; }
textarea.campo { resize: vertical; line-height: 1.45; }
.codigo { font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 0.78rem; word-break: break-all; }
select.campo { width: auto; max-width: 100%; }
.fila-campo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
.fila-campo > span:first-child { min-width: 110px; color: var(--texto-2); }
.fila-campo.casilla { gap: 8px; }
.fila-botones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.fila-botones.envolver { flex-wrap: wrap; }
.nota { color: var(--texto-3); font-size: 0.88rem; }
.nota.centrada { text-align: center; }
.error { color: var(--sangre); }
.etq { font-family: var(--f-sc); font-size: 0.78rem; letter-spacing: 0.08em; color: var(--texto-3); }
.pastilla { display: inline-flex; align-items: center; padding: 0.15em 0.6em; border-radius: 999px; font-size: 0.82rem; border: 1px solid var(--linea-2); background: var(--sup-2); color: var(--texto-2); margin: 2px 4px 2px 0; }
.pastilla.efecto { border-color: rgba(243, 199, 90, 0.5); color: var(--oro); background: rgba(243, 199, 90, 0.08); }
.pastilla.buena { border-color: rgba(99, 194, 144, 0.5); color: var(--vida); background: var(--vida-fondo); }
.pastilla.mala { border-color: rgba(226, 86, 94, 0.5); color: var(--sangre); background: var(--sangre-fondo); }
.seccion-titulo { font-family: var(--f-sc); font-weight: 700; font-size: 0.82rem; letter-spacing: 0.1em; color: var(--texto-3); border-bottom: 1px solid var(--linea); padding-bottom: 4px; margin: 18px 0 8px; }
.barra { height: 6px; border-radius: 4px; background: rgba(0, 0, 0, 0.45); overflow: hidden; }
.barra > span { display: block; height: 100%; border-radius: 4px; transition: width 0.35s; }
.barra-pg > span { background: linear-gradient(90deg, #3fa572, var(--vida)); }
.barra-px > span { background: linear-gradient(90deg, #b8822d, var(--antorcha-2)); }
.barra.mini { height: 3px; }
.puntos { display: inline-flex; gap: 3px; vertical-align: middle; }
.puntos i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: latido 1.2s infinite ease-in-out; }
.puntos i:nth-child(2) { animation-delay: 0.15s; }
.puntos i:nth-child(3) { animation-delay: 0.3s; }
@keyframes latido { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

/* ── Título ── */
.portada { max-width: 820px; margin: 0 auto; padding: 48px var(--gutter-der) 40px var(--gutter-izq); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; }
.portada-emblema { position: relative; width: 132px; height: 132px; filter: drop-shadow(0 0 28px rgba(233, 162, 59, 0.35)); }
.emblema-d20 { width: 100%; height: 100%; animation: flotar 6s ease-in-out infinite; }
.emblema-d20 .d20-cara { fill: var(--sup-2); stroke: var(--antorcha); stroke-width: 2; }
.emblema-d20 .d20-linea { fill: none; stroke: var(--antorcha); stroke-width: 1.2; opacity: 0.55; }
.emblema-num { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 14px; font-family: var(--f-display); font-size: 2.6rem; color: var(--antorcha-2); }
@keyframes flotar { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
.portada-nombre { font-family: var(--f-display); font-weight: 400; font-size: clamp(3.2rem, 11vw, 6.4rem); line-height: 0.95; letter-spacing: 0.01em; color: var(--texto); text-shadow: 0 0 40px rgba(233, 162, 59, 0.25); }
.portada-lema { font-family: var(--f-texto); font-style: italic; font-size: 1.25rem; color: var(--texto-2); max-width: 34ch; }
.portada-acciones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 10px 0 8px; }
.portada-claves { list-style: none; padding: 0; margin: 18px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; text-align: left; width: 100%; }
.portada-claves li { position: relative; padding: 14px 14px 14px 34px; border: 1px solid var(--linea); border-radius: var(--radio); background: rgba(26, 29, 38, 0.7); color: var(--texto-2); font-size: 0.95rem; }
.portada-claves li::before { content: ""; position: absolute; left: 14px; top: 21px; width: 8px; height: 8px; background: var(--antorcha); transform: rotate(45deg); }
.portada-claves b { color: var(--texto); }
.portada-pie { font-size: 0.8rem; color: var(--texto-3); margin-top: 18px; }

/* ── Creación ── */
.creacion { max-width: 1200px; margin: 0 auto; padding: 18px var(--gutter-der) 110px var(--gutter-izq); }
.creacion-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.creacion-cab h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 5vw, 2.8rem); }
.pasos { list-style: none; padding: 0; margin: 16px 0 20px; display: flex; gap: 6px; flex-wrap: wrap; }
.pasos button { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--linea); background: var(--sup); color: var(--texto-3); cursor: pointer; }
.pasos button:disabled { cursor: not-allowed; opacity: 0.5; }
.paso-num { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--sup-3); font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pasos .hecho button { color: var(--texto-2); }
.pasos .hecho .paso-num { background: var(--vida-fondo); color: var(--vida); }
.pasos .actual button { border-color: var(--antorcha); color: var(--texto); }
.pasos .actual .paso-num { background: var(--antorcha); color: var(--tinta-boton); }
.creacion-cuerpo { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; align-items: start; }
.creacion-paso { min-width: 0; }
.intro-paso { font-family: var(--f-texto); font-size: 1.12rem; color: var(--texto-2); max-width: 60ch; }
.rejilla-tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.rejilla-tarjetas.compacta { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.tarjeta {
  display: flex; flex-direction: column; align-items: flex-start; gap: 5px; text-align: left;
  padding: 13px 14px; border-radius: var(--radio); border: 1px solid var(--linea);
  background: var(--sup); cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; min-width: 0;
}
.tarjeta:hover:not(:disabled) { border-color: var(--linea-2); background: var(--sup-2); }
.tarjeta.activa { border-color: var(--antorcha); background: linear-gradient(180deg, var(--antorcha-fondo), transparent 80%), var(--sup); box-shadow: inset 0 0 0 1px var(--antorcha), 0 0 26px -10px rgba(233, 162, 59, 0.6); }
.tarjeta:disabled { cursor: not-allowed; opacity: 0.55; }
.tarjeta.activa:disabled { opacity: 1; }
.tarjeta-titulo { font-family: var(--f-texto); font-weight: 700; font-size: 1.14rem; color: var(--texto); }
.tarjeta-dato { font-family: var(--f-sc); font-size: 0.8rem; letter-spacing: 0.05em; color: var(--antorcha-2); }
.tarjeta-desc { font-size: 0.9rem; color: var(--texto-2); line-height: 1.42; }
.detalle { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--linea); border-radius: var(--radio); background: rgba(26, 29, 38, 0.6); }
.detalle h3 { font-family: var(--f-sc); font-size: 0.95rem; letter-spacing: 0.06em; color: var(--texto-2); margin: 4px 0 10px; }
.detalle h3:not(:first-child) { margin-top: 16px; }
.lista-rasgos { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 7px; font-size: 0.93rem; color: var(--texto-2); }
.lista-rasgos b { color: var(--texto); }
.nivel-chip { display: inline-block; font-family: var(--f-sc); font-size: 0.75rem; padding: 0 6px; margin-right: 6px; border-radius: 4px; background: var(--sup-3); color: var(--antorcha-2); }
.segmentado { display: inline-flex; border: 1px solid var(--linea-2); border-radius: var(--radio); overflow: hidden; margin: 6px 0 12px; flex-wrap: wrap; }
.segmentado button { padding: 7px 14px; border: 0; background: transparent; color: var(--texto-2); cursor: pointer; }
.segmentado button + button { border-left: 1px solid var(--linea-2); }
.segmentado button.activa { background: var(--antorcha-fondo); color: var(--antorcha-2); }
.tabla-car { display: grid; gap: 6px; margin-top: 10px; }
.fila-car { display: grid; grid-template-columns: minmax(130px, 1.4fr) minmax(90px, 1fr) minmax(70px, 0.8fr) 80px; align-items: center; gap: 10px; padding: 8px 12px; background: var(--sup); border: 1px solid var(--linea); border-radius: var(--radio); }
.car-nombre b { font-family: var(--f-sc); color: var(--antorcha-2); }
.car-bono { font-size: 0.82rem; color: var(--vida); }
.car-final { text-align: right; font-variant-numeric: tabular-nums; }
.car-final b { font-size: 1.25rem; margin-right: 6px; }
.paso-puntos { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.paso-puntos b { width: 26px; text-align: center; font-size: 1.1rem; }
.rejilla-casillas { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; }
.casilla { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
.casilla input { accent-color: var(--antorcha); width: 17px; height: 17px; }
.casilla.fija { color: var(--texto-3); }
.fila-nombre { display: flex; gap: 8px; margin-bottom: 18px; }
.campo-nombre { font-family: var(--f-texto); font-size: 1.4rem; padding: 0.4em 0.7em; }
.rejilla-modos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.tarjeta-modo .tarjeta-titulo { font-size: 1.25rem; }
.fila-ajustes { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-top: 10px; }
.resumen-creacion { position: sticky; top: 16px; padding: 16px; border: 1px solid var(--linea-2); border-radius: 12px; background: linear-gradient(180deg, rgba(233, 162, 59, 0.06), transparent 40%), var(--sup); display: grid; gap: 12px; min-width: 0; }
.resumen-creacion.vacio { color: var(--texto-3); font-family: var(--f-texto); font-style: italic; }
.resumen-nombre { font-family: var(--f-display); font-size: 2rem; line-height: 1; overflow-wrap: anywhere; }
.resumen-sub { color: var(--texto-2); font-size: 0.92rem; margin-top: -6px; }
.resumen-bloques { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.resumen-bloques > div, .resumen-car > div { display: flex; flex-direction: column; align-items: center; padding: 6px; border-radius: 6px; background: var(--fondo); border: 1px solid var(--linea); }
.resumen-bloques b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.resumen-car { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.resumen-car b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.resumen-car small { color: var(--antorcha-2); }
.resumen-lista { font-size: 0.88rem; color: var(--texto-2); display: grid; gap: 2px; }
.creacion-pie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px var(--gutter-der) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter-izq); background: rgba(18, 20, 26, 0.94); border-top: 1px solid var(--linea); backdrop-filter: blur(8px); }
.creacion-error { flex: 1; text-align: center; color: var(--texto-3); font-size: 0.9rem; }

/* ── Juego ── */
.juego { display: flex; flex-direction: column; height: 100%; }
.barra-sup { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px; padding: 8px var(--gutter-der) 8px var(--gutter-izq); background: rgba(26, 29, 38, 0.96); border-bottom: 1px solid var(--linea); backdrop-filter: blur(8px); }
.barra-marca { display: flex; align-items: center; gap: 8px; }
.mini-d20 { width: 26px; height: 26px; }
.mini-d20 .d20-cara, .d20-mini .d20-cara, .d20-boton .d20-cara { fill: none; stroke: var(--antorcha); stroke-width: 6; }
.mini-d20 .d20-linea, .d20-mini .d20-linea, .d20-boton .d20-linea { fill: none; stroke: var(--antorcha); stroke-width: 3; opacity: 0.6; }
.marca-texto { font-family: var(--f-display); font-size: 1.25rem; color: var(--texto); white-space: nowrap; }
.barra-heroe { min-width: 0; flex: 1; }
.heroe-nombre { font-family: var(--f-texto); font-weight: 700; font-size: 1.08rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heroe-sub { font-size: 0.82rem; color: var(--texto-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-stats { display: flex; align-items: center; gap: 14px; }
.barra-stats b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.stat-cab { display: flex; align-items: baseline; gap: 4px; }
.stat-cab .de { color: var(--texto-3); font-size: 0.85rem; }
.stat-cab .temp { color: var(--arcano); font-size: 0.85rem; }
.stat-pg, .stat-px { width: 110px; display: grid; gap: 3px; }
.stat-pg.critico b { color: var(--sangre); }
.stat-ca { display: grid; place-items: center; width: 44px; height: 46px; border: 1px solid var(--linea-2); border-radius: 6px 6px 22px 22px; background: var(--sup-2); line-height: 1.05; }
.stat-oro { display: flex; align-items: baseline; gap: 4px; color: var(--oro); }
.stat-oro b { color: var(--oro); }
.btn-inspiracion { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--linea-2); background: transparent; color: var(--texto-3); cursor: pointer; font-size: 1rem; }
.btn-inspiracion.activa { color: var(--oro); border-color: var(--oro); box-shadow: 0 0 14px -4px var(--oro); }
.btn-inspiracion.armada { background: var(--oro); color: var(--tinta-boton); }
.btn-inspiracion:disabled { cursor: default; opacity: 0.5; }
.pestanas-movil { display: none; }
.juego-cuerpo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 350px; grid-template-rows: minmax(0, 1fr); gap: 18px; width: 100%; max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 16px var(--gutter-der) 16px var(--gutter-izq); }
.escena { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--linea); border-radius: 12px; background: var(--sup); overflow: hidden; }
.panel-tabs { display: flex; border-bottom: 1px solid var(--linea); overflow-x: auto; }
.panel-tabs button { flex: 1; padding: 10px 8px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--texto-3); cursor: pointer; font-family: var(--f-sc); font-size: 0.88rem; letter-spacing: 0.04em; white-space: nowrap; }
.panel-tabs button.activa { color: var(--antorcha-2); border-bottom-color: var(--antorcha); }
.panel-cuerpo { flex: 1; overflow-y: auto; padding: 14px 16px 20px; }

.escena-cab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; padding-bottom: 10px; border-bottom: 1px solid var(--linea); margin-bottom: 10px; }
.escena-lugar { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.6rem, 3.6vw, 2.2rem); line-height: 1.05; }
.escena-mision { font-family: var(--f-texto); font-style: italic; color: var(--texto-2); margin: 0; max-width: 46ch; font-size: 0.98rem; }

/* ── DM ── */
.vista-dm { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.dm-log { flex: 1; min-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 8px 4px 16px 0; scroll-behavior: smooth; }
.msg-nuevo { animation: aparecer 0.35s ease-out; }
@keyframes aparecer { from { opacity: 0.35; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg-dm { display: flow-root; font-family: var(--f-texto); font-size: 1.13rem; line-height: 1.68; max-width: 68ch; color: var(--texto); }
.msg-dm p:first-child::first-letter { font-family: var(--f-display); float: left; font-size: 3.4em; line-height: 0.8; padding: 0.06em 0.1em 0 0; color: var(--antorcha); }
.msg-dm strong { color: var(--antorcha-2); font-weight: 700; }
.msg-dm.escribiendo p:last-child::after { content: ""; display: inline-block; width: 0.5em; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--antorcha); opacity: 0.7; animation: cursor 0.9s steps(2) infinite; }
@keyframes cursor { 50% { opacity: 0; } }
.pensando { color: var(--texto-3); font-style: italic; }
.msg-jugador { align-self: flex-end; max-width: 78%; padding: 8px 14px; border-radius: 14px 14px 3px 14px; background: var(--sup-2); border: 1px solid var(--linea-2); }
.msg-jugador .etq { display: block; color: var(--antorcha-2); }
.msg-jugador p { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
.msg-tirada { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-left: 3px solid var(--linea-2); background: var(--sup); border-radius: 0 6px 6px 0; font-size: 0.92rem; color: var(--texto-2); font-variant-numeric: tabular-nums; }
.msg-tirada.exito { border-left-color: var(--vida); }
.msg-tirada.fallo { border-left-color: var(--sangre); }
.d20-mini { width: 22px; height: 22px; flex: none; }
.msg-efectos { display: flex; flex-wrap: wrap; }
.msg-combate { padding: 8px 12px; border: 1px dashed var(--linea-2); border-radius: 6px; font-size: 0.92rem; color: var(--texto-2); }
.msg-combate.victoria b { color: var(--vida); }
.msg-combate.derrota b { color: var(--sangre); }
.msg-sistema { font-size: 0.85rem; color: var(--texto-3); font-style: italic; }
.msg-error { padding: 12px 14px; border: 1px solid var(--sangre); border-radius: var(--radio); background: var(--sangre-fondo); }
.dm-accion { display: grid; gap: 10px; padding-top: 10px; border-top: 1px solid var(--linea); }
.tarjeta-pendiente { padding: 14px 16px; border: 1px solid var(--antorcha); border-radius: 10px; background: linear-gradient(180deg, var(--antorcha-fondo), transparent 75%), var(--sup); }
.tarjeta-combate-pend { border-color: var(--sangre); background: linear-gradient(180deg, var(--sangre-fondo), transparent 75%), var(--sup); }
.pend-etq { font-family: var(--f-sc); font-weight: 700; letter-spacing: 0.1em; color: var(--antorcha-2); font-size: 0.85rem; margin-bottom: 6px; }
.tarjeta-combate-pend .pend-etq { color: var(--sangre); font-family: var(--f-display); font-size: 1.6rem; letter-spacing: 0.02em; font-weight: 400; }
.tirada-titulo { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-size: 1.12rem; }
.tirada-cd { font-family: var(--f-display); font-size: 1.5rem; color: var(--antorcha-2); }
.tirada-calculo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; color: var(--texto-2); }
.btn-tirar-d20 { font-size: 1.05rem; padding: 0.6em 1.2em; }
.d20-boton { width: 22px; height: 22px; }
.btn-primario .d20-boton .d20-cara, .btn-primario .d20-boton .d20-linea { stroke: var(--tinta-boton); }
.lista-enemigos { margin: 0 0 6px; padding-left: 18px; }
.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.opciones.columna { flex-direction: column; align-items: stretch; }
.opcion { font-family: var(--f-texto); font-size: 1.02rem; font-weight: 500; justify-content: flex-start; }
.opcion::before { content: "›"; color: var(--antorcha); font-weight: 700; margin-right: 2px; }
.opcion small { font-family: var(--f-ui); font-size: 0.82rem; }
.form-accion { display: flex; gap: 8px; align-items: stretch; }
.entrada { flex: 1; min-height: 46px; font-family: var(--f-texto); font-size: 1.05rem; }
.acciones-rapidas { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ── Mazmorra ── */
.vista-mazmorra { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.mz-cuerpo { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 18px; min-height: 0; flex: 1; }
.mz-mapa-caja { align-self: start; padding: 12px; border: 1px solid var(--linea); border-radius: 12px; background: var(--sup); }
.mz-mapa { display: grid; gap: 0; }
.mz-celda { aspect-ratio: 1; min-width: 0; }
.mz-celda.sala { position: relative; display: grid; place-items: center; border-radius: 7px; border: 1px solid var(--linea-2); background: var(--sup-2); font-family: var(--f-sc); font-size: 0.68rem; color: var(--texto-3); padding: 0; margin: 5px; }
.mz-celda.sala.oculta { background: transparent; border-style: dashed; }
.mz-celda.sala.visitada { color: var(--texto-2); }
.mz-celda.sala.resuelta { background: var(--sup-3); }
.mz-celda.tipo-jefe { border-color: var(--sangre); color: var(--sangre); }
.mz-celda.tipo-santuario { border-color: var(--vida); color: var(--vida); }
.mz-celda.tipo-mercader, .mz-celda.tipo-tesoro { border-color: rgba(243, 199, 90, 0.6); color: var(--oro); }
.mz-celda.actual { border-color: var(--antorcha); box-shadow: 0 0 0 2px var(--antorcha), 0 0 18px -4px var(--antorcha); }
.mz-celda.accesible { cursor: pointer; border-color: var(--antorcha); }
.mz-celda.accesible:hover { background: var(--antorcha-fondo); }
.mz-ficha { position: absolute; top: 5px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--antorcha-2); box-shadow: 0 0 8px var(--antorcha); }
.mz-celda.sala::before, .mz-celda.sala::after { content: none; position: absolute; background: var(--linea-2); }
.mz-celda.p-este::after { content: ""; right: -12px; top: 50%; width: 11px; height: 4px; margin-top: -2px; }
.mz-celda.p-sur::before { content: ""; bottom: -12px; left: 50%; width: 4px; height: 11px; margin-left: -2px; }
.mz-mapa.mini .mz-celda.sala { font-size: 0.6rem; }
.mz-sala { min-width: 0; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.mz-log { flex: 1; min-height: 140px; overflow-y: auto; display: grid; align-content: start; gap: 10px; font-family: var(--f-texto); font-size: 1.08rem; line-height: 1.62; padding-right: 4px; }
.mz-linea { margin: 0; }
.mz-linea.titulo b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; line-height: 1.1; color: var(--antorcha-2); margin-bottom: 4px; }
.mz-linea.peligro { color: #f1b2b5; }
.mz-linea.bueno b, .mz-linea.evento b { color: var(--antorcha-2); }
.mz-linea.malo { color: #f1b2b5; }
.mz-linea .tirada-txt { display: block; font-family: var(--f-ui); font-size: 0.86rem; color: var(--texto-3); font-variant-numeric: tabular-nums; }
.mz-acciones { display: grid; gap: 10px; padding-top: 10px; border-top: 1px solid var(--linea); }

/* ── Combate ── */
.vista-combate { display: grid; gap: 12px; }
.cmb-iniciativa { list-style: none; margin: 0; padding: 0 0 4px; display: flex; gap: 6px; overflow-x: auto; }
.cmb-iniciativa li button { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; gap: 1px 7px; align-items: center; min-width: 118px; max-width: 160px; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--linea); background: var(--sup); cursor: pointer; text-align: left; }
.cmb-iniciativa li button:disabled { cursor: default; }
.cmb-iniciativa .ini-sig { grid-row: span 2; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--sangre-fondo); border: 1.5px solid var(--sangre); font-family: var(--f-display); font-size: 0.85rem; }
.cmb-iniciativa .es-heroe .ini-sig { background: var(--antorcha); border-color: var(--antorcha-2); color: var(--tinta-boton); }
.cmb-iniciativa .ini-nombre { font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmb-iniciativa li.actual button { border-color: var(--antorcha); box-shadow: 0 0 14px -6px var(--antorcha); }
.cmb-iniciativa li.muerto { opacity: 0.35; }
.cmb-iniciativa sub, .ficha-sig sub { font-family: var(--f-ui); font-size: 0.6em; }
.cmb-principal { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; align-items: start; }
.cmb-tablero-caja { min-width: 0; }
.cmb-tablero { display: grid; gap: 2px; padding: 3px; border-radius: 8px; background: var(--junta); border: 1px solid var(--linea); max-width: 720px;
  --suelo: #262833; --suelo-2: #23252f; --junta: #14151b; --obst: #444457; --obst-2: #353546; }
.terreno-cripta { --suelo: #26252f; --suelo-2: #23222b; --obst: #4a4658; --obst-2: #3a3747; }
.terreno-cueva { --suelo: #2b2621; --suelo-2: #27231e; --obst: #5a4c3d; --obst-2: #45392d; }
.terreno-bosque { --suelo: #1f2a20; --suelo-2: #1c261d; --obst: #2f4a30; --obst-2: #233a24; }
.terreno-templo { --suelo: #2e2b25; --suelo-2: #2a2721; --obst: #5f584a; --obst-2: #4a4439; }
.terreno-ciudad, .terreno-taberna { --suelo: #2c2620; --suelo-2: #29231d; --obst: #5c4632; --obst-2: #4a3726; }
.terreno-llanura { --suelo: #252d22; --suelo-2: #222a1f; --obst: #55584a; --obst-2: #43463a; }
.terreno-pantano { --suelo: #222a26; --suelo-2: #1f2723; --obst: #1b3a33; --obst-2: #142c27; }
.terreno-ruinas { --suelo: #2a2a2a; --suelo-2: #262626; --obst: #545454; --obst-2: #414141; }
.terreno-volcan { --suelo: #2c2120; --suelo-2: #291e1d; --obst: #a03a1c; --obst-2: #6e2410; }
.cmb-celda { position: relative; aspect-ratio: 1; min-width: 0; padding: 0; border: 0; border-radius: 3px; background: var(--suelo); display: grid; place-items: center; cursor: default; }
.cmb-celda:nth-child(odd) { background: var(--suelo-2); }
.cmb-celda.obst { background: linear-gradient(160deg, var(--obst), var(--obst-2)); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.07), inset 0 -3px 0 rgba(0, 0, 0, 0.35); }
.terreno-volcan .cmb-celda.obst { background: radial-gradient(circle at 40% 35%, #f0812c, var(--obst) 55%, var(--obst-2)); }
.terreno-pantano .cmb-celda.obst { background: radial-gradient(circle at 50% 50%, #26514a, var(--obst) 70%); }
.cmb-celda.borde-huida { box-shadow: inset 2px 0 0 rgba(237, 229, 211, 0.12); }
.cmb-celda.alcanzable { background: #283630; cursor: pointer; }
.cmb-celda.alcanzable:hover { background: #355044; }
.cmb-celda.en-ruta { background: #3c5e4c; }
.cmb-celda.destino { background: #3f6b53; outline: 2px solid var(--vida); outline-offset: -2px; }
.cmb-celda.objetivo { cursor: pointer; box-shadow: inset 0 0 0 2px var(--sangre); }
.cmb-celda.libre { cursor: pointer; }
.cmb-celda.libre:hover { box-shadow: inset 0 0 0 2px var(--antorcha); }
.cmb-celda.en-area { box-shadow: inset 0 0 0 999px rgba(233, 162, 59, 0.3); }
.cmb-celda.aura { background-image: radial-gradient(circle, rgba(247, 197, 107, 0.16), transparent 72%); }
.resto { color: rgba(237, 229, 211, 0.18); font-size: 0.9rem; }
.ficha-ent { position: relative; display: grid; place-items: center; width: 80%; aspect-ratio: 1; border-radius: 50%; font-family: var(--f-display); font-size: clamp(0.66rem, 2.4vw, 1.12rem); line-height: 1; transition: transform 0.15s; }
.ficha-ent.heroe { background: radial-gradient(circle at 35% 30%, var(--antorcha-2), var(--antorcha) 60%, #9c6420); color: var(--tinta-boton); box-shadow: 0 0 0 2px #f9dca0, 0 0 14px rgba(233, 162, 59, 0.55); }
.ficha-ent.enemigo { background: radial-gradient(circle at 35% 30%, #4a2a30, #2c171b); color: var(--texto); box-shadow: 0 0 0 2px var(--sangre); }
.ficha-ent.tipo-muerto_viviente { box-shadow: 0 0 0 2px #c9d3dc; background: radial-gradient(circle at 35% 30%, #3e4450, #22262e); }
.ficha-ent.tipo-bestia { box-shadow: 0 0 0 2px #c08f55; background: radial-gradient(circle at 35% 30%, #4a3a2a, #2a2018); }
.ficha-ent.tipo-dragon { box-shadow: 0 0 0 2px #ff6b3d; background: radial-gradient(circle at 35% 30%, #6a2412, #351008); }
.ficha-ent.tipo-cieno { box-shadow: 0 0 0 2px #84c86c; background: radial-gradient(circle at 35% 30%, #2f4a27, #1a2a16); }
.ficha-ent.tipo-elemental, .ficha-ent.tipo-gigante { box-shadow: 0 0 0 2px #b9a68c; background: radial-gradient(circle at 35% 30%, #4b4438, #2a261f); }
.ficha-ent.tipo-monstruosidad { box-shadow: 0 0 0 2px #d07ad0; background: radial-gradient(circle at 35% 30%, #4a2a4a, #2a172a); }
.ficha-ent.jefe { width: 92%; box-shadow: 0 0 0 2px var(--fondo), 0 0 0 4px var(--oro), 0 0 16px rgba(243, 199, 90, 0.45); }
.ficha-ent.grande { width: 94%; }
.ficha-ent.activo { animation: activo 1.1s ease-in-out infinite; }
@keyframes activo { 50% { transform: scale(1.1); } }
.ficha-ent.seleccionado { outline: 2px dashed var(--antorcha-2); outline-offset: 3px; }
.ficha-ent.c-dormido, .ficha-ent.c-oculto { opacity: 0.55; }
.ficha-ent.c-invisible { opacity: 0.32; }
.ficha-ent.c-paralizado, .ficha-ent.c-expulsado, .ficha-ent.c-asustado { filter: saturate(0.3); }
.ficha-ent.c-paralizado { box-shadow: 0 0 0 2px var(--arcano); }
.ficha-ent.c-derribado .ficha-sig { transform: rotate(90deg); }
.ficha-ent.caido { filter: grayscale(1); opacity: 0.6; }
.ficha-sig { display: inline-flex; align-items: baseline; }
.ficha-pg { position: absolute; left: 12%; right: 12%; bottom: -5px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--vida) var(--pg), rgba(0, 0, 0, 0.7) var(--pg)); }
.ficha-ent.heroe .ficha-pg { background: linear-gradient(90deg, #2e8b5a var(--pg), rgba(0, 0, 0, 0.7) var(--pg)); }
.cmb-leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--texto-3); margin-top: 6px; }
.cmb-info { min-width: 0; display: grid; gap: 10px; padding: 12px; border: 1px solid var(--linea); border-radius: 10px; background: var(--sup); font-size: 0.92rem; }
.cmb-ayuda { color: var(--texto-2); margin: 0; }
.cmb-turno-enemigo { margin: 0; color: var(--sangre); font-weight: 600; }
.aviso-oa { color: var(--antorcha-2); font-size: 0.88rem; }
.cmb-modo p { margin-bottom: 4px; }
.ficha-enemigo { display: grid; gap: 6px; padding-top: 4px; }
.fe-cab { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
.fe-cab b { font-family: var(--f-texto); font-size: 1.1rem; }
.fe-cab small { grid-column: 1; }
.fe-cab .btn-icono { grid-row: 1 / span 2; grid-column: 2; }
.fe-datos { display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.fe-desc { font-family: var(--f-texto); font-style: italic; color: var(--texto-2); margin: 0; }
.fe-ataques, .fe-res { font-size: 0.82rem; color: var(--texto-3); margin: 0; }
.salvaciones-muerte { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.88rem; }
.salvaciones-muerte i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--vida); margin-left: 4px; vertical-align: -1px; }
.salvaciones-muerte i.f { border-color: var(--sangre); }
.salvaciones-muerte i.lleno { background: var(--vida); }
.salvaciones-muerte i.f.lleno { background: var(--sangre); }
.cmb-acciones { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--linea-2); border-radius: 10px; background: var(--sup); }
.recursos { display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: 0.85rem; }
.recurso { display: inline-flex; align-items: center; gap: 5px; color: var(--texto-3); }
.recurso i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--texto-3); }
.recurso.disp { color: var(--texto); }
.recurso.disp i { background: var(--antorcha); border-color: var(--antorcha); }
.recurso.conc { color: var(--arcano); }
.recurso.furia { color: var(--sangre); font-weight: 700; }
.botonera { display: flex; flex-wrap: wrap; gap: 8px; }
.botonera .btn.abierto { border-color: var(--antorcha); background: var(--antorcha-fondo); }
.btn-fin-turno { margin-left: auto; }
.submenu { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; padding-top: 4px; }
.item-menu { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--linea); background: var(--sup-2); cursor: pointer; text-align: left; min-width: 0; }
.item-menu:hover:not(:disabled) { border-color: var(--antorcha); }
.item-menu:disabled { opacity: 0.5; cursor: not-allowed; }
.item-menu small { font-size: 0.8rem; }
.item-menu em { font-size: 0.78rem; color: var(--sangre); font-style: normal; }
.item-menu.con-niveles { cursor: default; }
.niveles { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.cmb-log { max-height: 210px; overflow-y: auto; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 10px; background: rgba(18, 20, 26, 0.6); font-size: 0.88rem; line-height: 1.45; color: var(--texto-2); }
.cmb-log .l { margin: 0 0 4px; }
.cmb-log .l b.n-heroe { color: var(--antorcha-2); }
.cmb-log .l b.n-enemigo { color: #f0a4a8; }
.cmb-log .critico { color: var(--oro); }
.cmb-log .critico-malo { color: var(--sangre); font-weight: 600; }
.cmb-log .malo, .cmb-log .golpe { color: #f0b9bc; }
.cmb-log .bueno { color: #9ddbb8; }
.cmb-log .fallo { color: var(--texto-3); }
.cmb-log .conjuro { color: var(--arcano); }
.cmb-log .ronda { color: var(--texto-3); text-align: center; font-family: var(--f-sc); letter-spacing: 0.1em; margin-top: 6px; }
.cmb-log .titulo .l-titulo, .cmb-log .l-titulo { font-family: var(--f-display); font-size: 1.15rem; color: var(--antorcha-2); }
#capa-flotantes { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
.flotante { position: fixed; transform: translateX(-50%); font-family: var(--f-display); font-size: 1.35rem; text-shadow: 0 2px 6px #000; animation: subir 1.25s ease-out forwards; white-space: nowrap; }
.flotante.dano { color: var(--sangre); }
.flotante.critico { color: var(--oro); font-size: 1.8rem; }
.flotante.cura { color: var(--vida); }
.flotante.nota { color: var(--texto-2); font-size: 1rem; }
@keyframes subir { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -38px); } }

/* ── Panel lateral ── */
.ficha-cab { margin-bottom: 10px; }
.ficha-nombre { font-family: var(--f-display); font-size: 1.7rem; line-height: 1.05; overflow-wrap: anywhere; }
.ficha-sub { color: var(--texto-3); font-size: 0.85rem; }
.ficha-bloques { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 6px; margin-bottom: 10px; }
.bloque-dato { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; border: 1px solid var(--linea); border-radius: 7px; background: var(--fondo); text-align: center; }
.bloque-dato b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.bloque-dato .etq { font-size: 0.7rem; }
.ficha-car { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.car-caja { display: flex; flex-direction: column; align-items: center; padding: 7px 4px 6px; border: 1px solid var(--linea-2); border-radius: 8px; background: var(--fondo); }

// Equipo inicial según clase (y estilo de combate cuando importa)
function equipoInicial(claseId, estilo) {
  switch (claseId) {
    case 'guerrero':
      if (estilo === 'arqueria') return ['cuero_tachonado', 'arco_largo', 'espada_corta', 'pocion_curacion'];
      if (estilo === 'gran_arma') return ['cota_malla', 'gran_espada', 'jabalina', 'pocion_curacion'];
      return ['cota_malla', 'espada_larga', 'escudo', 'ballesta_ligera', 'pocion_curacion'];
    case 'barbaro': return ['hacha_dos_manos', 'hacha_mano', 'jabalina', 'pocion_curacion'];
    case 'picaro': return ['cuero', 'estoque', 'arco_corto', 'daga', 'herramientas_ladron', 'pocion_curacion'];
    case 'explorador': return ['cota_escamas', 'espada_corta', 'arco_largo', 'pocion_curacion'];
    case 'paladin': return ['cota_malla', 'espada_larga', 'escudo', 'jabalina', 'simbolo_sagrado', 'pocion_curacion'];
    case 'clerigo': return ['cota_escamas', 'maza', 'escudo', 'ballesta_ligera', 'simbolo_sagrado', 'pocion_curacion'];
    case 'mago': return ['baston', 'daga', 'libro_conjuros', 'pocion_curacion'];
    case 'brujo': return ['cuero', 'ballesta_ligera', 'daga', 'foco_arcano', 'pocion_curacion'];
    default: return ['daga', 'pocion_curacion'];
  }
}

function conjurosDeClase(claseId, nivelMax) {
  return Object.entries(CONJUROS).filter(([, c]) => c.clases.includes(claseId) && c.nivel <= nivelMax).map(([id]) => id);
}

// ── personaje.js ──
// ─── Modelo del héroe: estadísticas derivadas, descansos, nivel e inventario ───

function crearHeroe(op) {
  // op: {nombre, raza, clase, trasfondo, base:{fue..}, habilidades:[], pericia:[], estilo, enemigoPredilecto, linaje, trucos:[], conjuros:[]}
  const raza = RAZAS[op.raza], clase = CLASES[op.clase], tras = TRASFONDOS[op.trasfondo];
  const base = {};
  for (const c of CARACTERISTICAS) base[c.id] = (op.base[c.id] || 10) + ((raza.bonos || {})[c.id] || 0);
  const habilidades = new Set([...(op.habilidades || []), ...(tras ? tras.habilidades : []), ...(raza.habilidades || [])]);
  const heroe = {
    nombre: op.nombre || 'Sin nombre', raza: op.raza, clase: op.clase, trasfondo: op.trasfondo,
    nivel: 1, px: 0, base,
    habilidades: Array.from(habilidades), pericia: op.pericia || [],
    estilo: op.estilo || null, enemigoPredilecto: op.enemigoPredilecto || null, linaje: op.linaje || null,
    invocaciones: [], trucos: op.trucos || [], conjuros: op.conjuros || [],
    pg: 0, pgMax: 0, pgTemp: 0, dadosGolpe: 1,
    espaciosUsados: [0, 0, 0, 0],
    recursos: {},
    inventario: [], oro: (tras ? tras.oro : 10) + 10,
    condiciones: [], efectos: {}, inspiracion: true,
    muerte: { exitos: 0, fallos: 0 }, caido: false, muerto: false,
    estadisticas: { enemigos: 0, criticos: 0, danioHecho: 0, danioRecibido: 0, combates: 0 },
  };
  for (const id of equipoInicial(op.clase, op.estilo)) anadirObjeto(heroe, id, 1, true);
  heroe.pgMax = calcularPgMax(heroe);
  heroe.pg = heroe.pgMax;
  reiniciarRecursos(heroe, 'largo');
  return heroe;
}

function calcularPgMax(heroe) {
  const clase = CLASES[heroe.clase], raza = RAZAS[heroe.raza];
  const conMod = modificador(valorCar(heroe, 'con'));
  const dif = DIFICULTADES[(typeof estado !== 'undefined' && estado && estado.ajustes && estado.ajustes.dificultad) || 'normal'] || DIFICULTADES.normal;
  // Nivel 1: dado máximo; después, la media (o lo tirado al subir de nivel, guardado en pgSubidas)
  let pg = clase.dado + conMod;
  const subidas = heroe.pgSubidas || [];
  for (let n = 2; n <= heroe.nivel; n++) pg += Math.max(1, (subidas[n] != null ? subidas[n] : Math.floor(clase.dado / 2) + 1) + conMod);
  pg += (raza.pgPorNivel || 0) * heroe.nivel;
  pg += dif.pgExtraNivel * heroe.nivel;
  pg += heroe.efectos.auxilio || 0;
  return Math.max(1, pg);
}

function recalcularPg(heroe) {
  const antes = heroe.pgMax;
  heroe.pgMax = calcularPgMax(heroe);
  if (heroe.pgMax > antes) heroe.pg += heroe.pgMax - antes;
  heroe.pg = Math.min(heroe.pg, heroe.pgMax);
}

function objetosEquipados(heroe) { return heroe.inventario.filter(i => i.equipado && OBJETOS[i.id]); }

function valorCar(heroe, car) {
  let v = heroe.base[car];
  for (const it of objetosEquipados(heroe)) {
    const o = OBJETOS[it.id];
    if (o.fijaCar && o.fijaCar[car]) v = Math.max(v, o.fijaCar[car]);
  }
  if (car === 'fue' && heroe.efectos.fuerzaGigante) v = Math.max(v, 21);
  return v;
}
function modCar(heroe, car) { return modificador(valorCar(heroe, car)); }
function competencia(heroe) { return bonoCompetencia(heroe.nivel); }
function tieneRasgo(heroe, id) { return CLASES[heroe.clase].rasgos.some(r => r.id === id && r.nivel <= heroe.nivel); }

function armaduraEquipada(heroe) { const it = heroe.inventario.find(i => i.equipado && OBJETOS[i.id] && OBJETOS[i.id].tipo === 'armadura'); return it ? OBJETOS[it.id] : null; }
function escudoEquipado(heroe) { const it = heroe.inventario.find(i => i.equipado && OBJETOS[i.id] && OBJETOS[i.id].tipo === 'escudo'); return it ? OBJETOS[it.id] : null; }

function competenteArmadura(heroe, obj) {
  const c = CLASES[heroe.clase];
  if (obj.tipo === 'escudo') return c.armaduras.includes('escudo');
  return c.armaduras.includes(obj.armadura);
}
function competenteArma(heroe, obj) {
  const c = CLASES[heroe.clase];
  return c.armas.includes(obj.categoria) || c.armas.includes(obj.base || '') || c.armas.includes(Object.keys(OBJETOS).find(k => OBJETOS[k] === obj));
}

function claseArmadura(heroe, opciones = {}) {
  const arm = armaduraEquipada(heroe), esc = escudoEquipado(heroe);
  const des = modCar(heroe, 'des');
  let ca;
  if (arm) {
    ca = arm.ca + Math.min(des, arm.desMax);
    if (heroe.estilo === 'defensa') ca += 1;
  } else if (tieneRasgo(heroe, 'defensa_sin_armadura')) {
    ca = 10 + des + modCar(heroe, 'con');
  } else if (heroe.efectos.armaduraMago || (heroe.invocaciones || []).includes('armadura_sombras')) {
    ca = 13 + des;
  } else {
    ca = 10 + des;
  }
  if (esc) ca += esc.ca;
  for (const it of objetosEquipados(heroe)) {
    const o = OBJETOS[it.id];
    if (o.bonoCA) ca += o.bonoCA;
    if (o.bonoCASinArmadura && !arm && !esc) ca += o.bonoCASinArmadura;
  }
  if (opciones.combate !== false) {
    if (heroe.efectos.escudoFe) ca += 2;
    if (heroe.efectos.escudoReaccion) ca += 5;
    if (heroe.efectos.pielRobliza) ca = Math.max(ca, 16);
  }
  return ca;
}

function velocidad(heroe) {
  let v = RAZAS[heroe.raza].vel;
  const arm = armaduraEquipada(heroe);
  if (tieneRasgo(heroe, 'movimiento_rapido') && !(arm && arm.armadura === 'pesada')) v += 2;
  if (arm && arm.fuerzaMin && valorCar(heroe, 'fue') < arm.fuerzaMin) v -= 2;
  for (const it of objetosEquipados(heroe)) { const o = OBJETOS[it.id]; if (o.bonoVel) v += o.bonoVel; }
  return v;
}

function bonoHabilidad(heroe, hab) {
  const info = HABILIDADES[hab];
  let b = modCar(heroe, info.car);
  if (heroe.habilidades.includes(hab)) b += competencia(heroe) * (heroe.pericia.includes(hab) ? 2 : 1);
  return b;
}
function bonoSalvacion(heroe, car) {
  let b = modCar(heroe, car);
  if (CLASES[heroe.clase].salvaciones.includes(car)) b += competencia(heroe);
  for (const it of objetosEquipados(heroe)) { const o = OBJETOS[it.id]; if (o.bonoSalv) b += o.bonoSalv; }
  return b;
}
function percepcionPasiva(heroe) { return 10 + bonoHabilidad(heroe, 'percepcion'); }

// ─── Magia ───
function carLanzamiento(heroe) { const l = CLASES[heroe.clase].lanzamiento; return l ? l.car : null; }
function esLanzador(heroe) {
  const l = CLASES[heroe.clase].lanzamiento;
  if (!l) return false;

}
function bonoAtaqueConjuro(heroe) {
  const car = carLanzamiento(heroe) || 'int';
  let b = competencia(heroe) + modCar(heroe, car);
  for (const it of objetosEquipados(heroe)) { const o = OBJETOS[it.id]; if (o.bonoConjuro) b += o.bonoConjuro; }
  return b;
}
function cdConjuro(heroe) { const car = carLanzamiento(heroe) || 'int'; return 8 + competencia(heroe) + modCar(heroe, car); }

// Devuelve [n1, n2, n3] espacios totales por nivel de conjuro
function espaciosTotales(heroe) {
  const l = CLASES[heroe.clase].lanzamiento;
  if (!l) return [0, 0, 0];
  if (l.espacios === 'pacto') {
    const [cant, niv] = ESPACIOS_PACTO[heroe.nivel];
    const r = [0, 0, 0]; r[niv - 1] = cant; return r;
  }
  const tabla = l.espacios === 'completo' ? ESPACIOS_COMPLETO : ESPACIOS_MEDIO;
  const fila = tabla[heroe.nivel] || [];
  return [fila[0] || 0, fila[1] || 0, fila[2] || 0];
}
function espaciosLibres(heroe) {
  const t = espaciosTotales(heroe);
  return t.map((n, i) => Math.max(0, n - (heroe.espaciosUsados[i] || 0)));
}
function nivelMaxConjuro(heroe) {
  const t = espaciosTotales(heroe);
  for (let i = t.length - 1; i >= 0; i--) if (t[i] > 0) return i + 1;
  return 0;
}
function gastarEspacio(heroe, nivel) {
  if (espaciosLibres(heroe)[nivel - 1] <= 0) return false;
  heroe.espaciosUsados[nivel - 1] = (heroe.espaciosUsados[nivel - 1] || 0) + 1;
  return true;
}

// Conjuros que el héroe puede lanzar ahora mismo (ids)
function conjurosDisponibles(heroe) {
  const l = CLASES[heroe.clase].lanzamiento;
  const maxNivel = nivelMaxConjuro(heroe);
  let lista = [...heroe.trucos];
  if (l) {
    if (l.tipo === 'preparados') lista = lista.concat(conjurosDeClase(heroe.clase, maxNivel).filter(id => CONJUROS[id].nivel > 0));
    else lista = lista.concat(heroe.conjuros.filter(id => CONJUROS[id] && CONJUROS[id].nivel <= maxNivel));
  }
  if (RAZAS[heroe.raza].reprension && heroe.nivel >= 3 && !lista.includes('reprension_infernal')) lista.push('reprension_infernal@raza');
  return Array.from(new Set(lista));
}

function cuantosTrucos(heroe) {
  const l = CLASES[heroe.clase].lanzamiento;
  let n = l ? (l.trucos[heroe.nivel - 1] || 0) : 0;
  if (tieneRasgo(heroe, 'pacto_tomo')) n += 2;
  return n;
}
function cuantosConjurosConocidos(heroe) {

  if (!l || l.tipo !== 'conocidos') return 0;
  return l.conocidos[heroe.nivel - 1] || 0;
}
function opcionesTrucos(heroe) {

  if (tieneRasgo(heroe, 'pacto_tomo')) return Object.keys(CONJUROS).filter(id => CONJUROS[id].nivel === 0);
  return propios;

// ─── Recursos de clase y raza ───
function maxRecurso(heroe, rec) {
  switch (rec) {
    case 'furia': return heroe.nivel >= 3 ? 3 : 2;
    case 'imposicion': return 5 * heroe.nivel;
    default: return 1;
  }
}
function reiniciarRecursos(heroe, tipo) {
  const r = heroe.recursos;
  // Se recuperan con descanso corto
  r.tomarAliento = 1; r.oleada = 1; r.canalizar = 1; r.aliento = 1;
  if (CLASES[heroe.clase].lanzamiento && CLASES[heroe.clase].lanzamiento.espacios === 'pacto') heroe.espaciosUsados = [0, 0, 0, 0];
  if (tipo === 'largo') {
    r.furia = maxRecurso(heroe, 'furia');
    r.imposicion = maxRecurso(heroe, 'imposicion');
    r.aguante = 1; r.reprension = 1; r.recuperacionArcana = 1; r.perla = 1;
    heroe.espaciosUsados = [0, 0, 0, 0];
    heroe.dadosGolpe = Math.min(heroe.nivel, heroe.dadosGolpe + Math.max(1, Math.floor(heroe.nivel / 2)));
  }
}

function descansoCorto(heroe) {
  reiniciarRecursos(heroe, 'corto');
  heroe.muerte = { exitos: 0, fallos: 0 };
}
function gastarDadoGolpe(heroe) {
  if (heroe.dadosGolpe <= 0 || heroe.pg >= heroe.pgMax) return null;
  heroe.dadosGolpe--;
  const t = tirarDados('1d' + CLASES[heroe.clase].dado);
  const cura = Math.max(1, t.total + modCar(heroe, 'con'));
  const antes = heroe.pg;
  heroe.pg = Math.min(heroe.pgMax, heroe.pg + cura);
  return { tirada: t, cura: heroe.pg - antes };
}
function descansoLargo(heroe) {
  if (heroe.efectos.auxilio) { heroe.efectos.auxilio = 0; }
  heroe.efectos.armaduraMago = false;
  heroe.efectos.resistFuego = false;
  heroe.pgMax = calcularPgMax(heroe);
  heroe.pg = heroe.pgMax; heroe.pgTemp = 0;
  heroe.condiciones = [];
  heroe.muerte = { exitos: 0, fallos: 0 }; heroe.caido = false;
  reiniciarRecursos(heroe, 'largo');
  for (const it of heroe.inventario) { const o = OBJETOS[it.id]; if (o && o.tipo === 'varita' && it.cargas != null) it.cargas = Math.min(o.cargas, it.cargas + 1 + azar(3)); }
}

// ─── Inventario ───
function anadirObjeto(heroe, id, cantidad = 1, equipar = false, extra = null) {
  const o = OBJETOS[id];
  if (!o) {
    // Objeto narrativo inventado por el DM
    const nombre = (extra && extra.nombre) || id;
    const existente = heroe.inventario.find(i => !OBJETOS[i.id] && i.nombre === nombre);
    if (existente) { existente.cantidad += cantidad; return existente; }
    const it = { uid: uid('o'), id: 'narrativo', nombre, descripcion: (extra && extra.descripcion) || '', cantidad };
    heroe.inventario.push(it); return it;
  }
  const apilable = o.tipo === 'consumible' || o.tipo === 'pergamino' || o.tipo === 'util';
  if (apilable) {
    const existente = heroe.inventario.find(i => i.id === id);
    if (existente) { existente.cantidad += cantidad; return existente; }
  }
  let ultimo = null;
  const veces = apilable ? 1 : cantidad;
  for (let k = 0; k < veces; k++) {
    const it = { uid: uid('o'), id, cantidad: apilable ? cantidad : 1, equipado: false };
    if (o.tipo === 'varita') it.cargas = o.cargas;
    heroe.inventario.push(it);
    if (equipar && k === 0) equiparObjeto(heroe, it.uid, true);
    ultimo = it;
  }
  return ultimo;
}
function quitarObjeto(heroe, uidObj, cantidad = 1) {
  const i = heroe.inventario.findIndex(x => x.uid === uidObj);
  if (i < 0) return false;
  const it = heroe.inventario[i];
  it.cantidad -= cantidad;
  if (it.cantidad <= 0) heroe.inventario.splice(i, 1);
  return true;
}
function contarObjeto(heroe, id) { return heroe.inventario.filter(i => i.id === id).reduce((s, i) => s + i.cantidad, 0); }

function nombreObjeto(it) { return OBJETOS[it.id] ? OBJETOS[it.id].nombre : it.nombre; }

function armasEquipadas(heroe) {
  return heroe.inventario.filter(i => i.equipado && OBJETOS[i.id] && OBJETOS[i.id].tipo === 'arma');
}

// Equipa respetando huecos: 1 armadura, 1 escudo, hasta 2 armas, 1 objeto por ranura
function equiparObjeto(heroe, uidObj, equipar) {
  const it = heroe.inventario.find(x => x.uid === uidObj);
  if (!it) return 'No encuentras ese objeto.';
  const o = OBJETOS[it.id];
  if (!o || !['arma', 'armadura', 'escudo', 'magico'].includes(o.tipo)) return 'Ese objeto no se equipa.';
  if (!equipar) { it.equipado = false; return null; }
  if (o.tipo === 'armadura') {
    heroe.inventario.forEach(x => { if (x !== it && OBJETOS[x.id] && OBJETOS[x.id].tipo === 'armadura') x.equipado = false; });
  } else if (o.tipo === 'escudo') {
    heroe.inventario.forEach(x => { if (x !== it && OBJETOS[x.id] && OBJETOS[x.id].tipo === 'escudo') x.equipado = false; });
    heroe.inventario.forEach(x => { if (x.equipado && OBJETOS[x.id] && OBJETOS[x.id].tipo === 'arma' && (OBJETOS[x.id].props || []).includes('dos_manos') && !(OBJETOS[x.id].props || []).includes('a_distancia')) x.equipado = false; });
  } else if (o.tipo === 'arma') {
    const armas = armasEquipadas(heroe).filter(x => x !== it);
    if (armas.length >= 2) armas[0].equipado = false;
    if ((o.props || []).includes('dos_manos') && !(o.props || []).includes('a_distancia')) {
      heroe.inventario.forEach(x => { if (OBJETOS[x.id] && OBJETOS[x.id].tipo === 'escudo') x.equipado = false; });
    }
  } else if (o.tipo === 'magico') {
    heroe.inventario.forEach(x => { if (x !== it && OBJETOS[x.id] && OBJETOS[x.id].ranura === o.ranura && OBJETOS[x.id].tipo === 'magico') x.equipado = false; });
  }
  it.equipado = true;
  return null;
}

// ─── Ataques con arma ───
function perfilArma(heroe, it) {
  const o = OBJETOS[it.id];
  const props = o.props || [];
  const distancia = props.includes('a_distancia');
  const sutil = props.includes('sutil');
  let car = distancia ? 'des' : 'fue';
  if (sutil && modCar(heroe, 'des') > modCar(heroe, 'fue')) car = 'des';
  const comp = competenteArma(heroe, o) ? competencia(heroe) : 0;
  const magico = o.magico || 0;
  let bono = modCar(heroe, car) + comp + magico;
  if (distancia && heroe.estilo === 'arqueria') bono += 2;
  if (heroe.efectos.armaSagrada) bono += Math.max(1, modCar(heroe, 'car'));
  const sinEscudo = !escudoEquipado(heroe);
  const otrasArmasCuerpo = armasEquipadas(heroe).filter(x => x !== it && !(OBJETOS[x.id].props || []).includes('a_distancia'));
  const dados = (o.versatil && sinEscudo && otrasArmasCuerpo.length === 0) ? o.versatil : o.danio;
  let modDanio = modCar(heroe, car) + magico;
  if (heroe.estilo === 'duelo' && !distancia && !props.includes('dos_manos') && otrasArmasCuerpo.length === 0) modDanio += 2;
  return {
    uid: it.uid, id: it.id, nombre: o.nombre, bono, dados, modDanio, tipo: o.tipoDanio, car,
    alcance: distancia ? 0 : 1, distancia: o.distancia || null, aDistancia: distancia, arrojadiza: props.includes('arrojadiza'),
    sutil, dosManos: props.includes('dos_manos'), magico: magico > 0 || !!o.danioExtra, extra: o.danioExtra || null, tipoExtra: o.tipoExtra || null,
  };
}

function ataquesDisponibles(heroe) {
  const armas = armasEquipadas(heroe).map(it => perfilArma(heroe, it));
  if (!armas.length) {
    const fue = modCar(heroe, 'fue');
    armas.push({ uid: 'desarmado', id: 'desarmado', nombre: 'Golpe sin armas', bono: fue + competencia(heroe), dados: '1', modDanio: fue, tipo: 'contundente', car: 'fue', alcance: 1, distancia: null, aDistancia: false });
  }
  return armas;
}

// ─── Experiencia y nivel ───
function ganarPx(heroe, px) {
  heroe.px += Math.max(0, Math.round(px));
  return puedeSubirNivel(heroe);
}
function puedeSubirNivel(heroe) { return heroe.nivel < NIVEL_MAXIMO && heroe.px >= UMBRAL_PX[heroe.nivel + 1]; }

// Aplica la subida (las elecciones vienen de la interfaz)
function subirNivel(heroe, eleccion) {
  // eleccion: {pg: 'media'|n, mejora: {car: +n}, trucos:[], conjuros:[], invocaciones:[], estilo}
  heroe.nivel++;
  heroe.pgSubidas = heroe.pgSubidas || [];
  const clase = CLASES[heroe.clase];
  heroe.pgSubidas[heroe.nivel] = typeof eleccion.pg === 'number' ? eleccion.pg : Math.floor(clase.dado / 2) + 1;
  if (eleccion.mejora) for (const [car, v] of Object.entries(eleccion.mejora)) heroe.base[car] = Math.min(20, heroe.base[car] + v);
  if (eleccion.trucos) heroe.trucos = Array.from(new Set([...heroe.trucos, ...eleccion.trucos]));
  if (eleccion.conjuros) heroe.conjuros = Array.from(new Set([...heroe.conjuros, ...eleccion.conjuros]));
  if (eleccion.invocaciones) heroe.invocaciones = Array.from(new Set([...(heroe.invocaciones || []), ...eleccion.invocaciones]));
  if (eleccion.estilo) heroe.estilo = eleccion.estilo;
  heroe.dadosGolpe++;
  const antes = heroe.pgMax;
  heroe.pgMax = calcularPgMax(heroe);
  heroe.pg += heroe.pgMax - antes;
  if (heroe.recursos.furia != null) heroe.recursos.furia = Math.min(maxRecurso(heroe, 'furia'), heroe.recursos.furia + (heroe.nivel === 3 ? 1 : 0));
  if (heroe.recursos.imposicion != null) heroe.recursos.imposicion += 5;
}

function rasgosNuevos(heroe, nivel) { return CLASES[heroe.clase].rasgos.filter(r => r.nivel === nivel); }

// ─── Condiciones ───
function tieneCondicion(ent, id) { return (ent.condiciones || []).some(c => c.id === id); }
function ponerCondicion(ent, id, extra = {}) {
  if (!ent.condiciones) ent.condiciones = [];
  const prev = ent.condiciones.find(c => c.id === id);
  if (prev) { Object.assign(prev, extra); return prev; }
  const c = Object.assign({ id }, extra);
  ent.condiciones.push(c); return c;
}
function quitarCondicion(ent, id) { if (ent.condiciones) ent.condiciones = ent.condiciones.filter(c => c.id !== id); }

// Resumen textual de la ficha (para el DM)
function resumenFicha(heroe) {
  const raza = RAZAS[heroe.raza], clase = CLASES[heroe.clase];
  const cars = CARACTERISTICAS.map(c => `${c.abrev} ${valorCar(heroe, c.id)} (${signo(modCar(heroe, c.id))})`).join(', ');
  const habs = heroe.habilidades.map(hb => HABILIDADES[hb].nombre + ' ' + signo(bonoHabilidad(heroe, hb))).join(', ');
  const equipo = heroe.inventario.map(it => nombreObjeto(it) + (it.cantidad > 1 ? ' ×' + it.cantidad : '') + (it.equipado ? ' (equipado)' : '')).join(', ') || 'nada';
  const conj = conjurosDisponibles(heroe).map(id => (CONJUROS[id.split('@')[0]] || {}).nombre).filter(Boolean).join(', ');
  const esp = espaciosTotales(heroe).map((t, i) => t ? `${i + 1}º: ${espaciosLibres(heroe)[i]}/${t}` : null).filter(Boolean).join(', ');
  const conds = (heroe.condiciones || []).map(c => (CONDICIONES[c.id] || { nombre: c.id }).nombre).join(', ') || 'ninguna';
  return [
    `Nombre: ${heroe.nombre}. ${raza.nombre} ${clase.nombre.toLowerCase()} de nivel ${heroe.nivel}. Trasfondo: ${TRASFONDOS[heroe.trasfondo].nombre}.`,
    `PG ${heroe.pg}/${heroe.pgMax}${heroe.pgTemp ? ' (+' + heroe.pgTemp + ' temporales)' : ''}. CA ${claseArmadura(heroe)}. PX ${heroe.px}${heroe.nivel < NIVEL_MAXIMO ? '/' + UMBRAL_PX[heroe.nivel + 1] : ''}. Oro: ${heroe.oro} po.`,
    `Características: ${cars}. Percepción pasiva ${percepcionPasiva(heroe)}.`,
    `Habilidades con competencia: ${habs}.`,
    `Equipo: ${equipo}.`,

    `Condiciones: ${conds}.${heroe.inspiracion ? ' Tiene inspiración.' : ''}`,
  ].filter(Boolean).join('\n');
}

// ── exploracion.js ──
// ─── Exploración: pruebas de característica, efectos narrativos y descansos ───

const SIN_TILDES = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

function normalizarHabilidad(v) {
  const s = SIN_TILDES(v).replace(/\s+/g, '_');
  if (HABILIDADES[s]) return s;
  for (const [id, hb] of Object.entries(HABILIDADES)) if (SIN_TILDES(hb.nombre).replace(/\s+/g, '_') === s) return id;
  const alias = { sigil: 'sigilo', stealth: 'sigilo', percepcion: 'percepcion', perception: 'percepcion', atletica: 'atletismo', athletics: 'atletismo', persuadir: 'persuasion', enganar: 'engano', intimidar: 'intimidacion', investigar: 'investigacion', trato_con_animales: 'trato_animales', juego_de_manos: 'juego_manos', arcana: 'arcanos', insight: 'perspicacia', medicine: 'medicina', survival: 'supervivencia', nature: 'naturaleza', religion: 'religion', history: 'historia', acrobatics: 'acrobacias', performance: 'interpretacion', deception: 'engano' };
  return alias[s] || null;
}
function normalizarCaracteristica(v) {
  const s = SIN_TILDES(v);
  const mapa = { fue: 'fue', fuerza: 'fue', str: 'fue', des: 'des', destreza: 'des', dex: 'des', con: 'con', constitucion: 'con', int: 'int', inteligencia: 'int', sab: 'sab', sabiduria: 'sab', wis: 'sab', car: 'car', carisma: 'car', cha: 'car' };
  return mapa[s] || mapa[s.slice(0, 3)] || null;
}

// Describe una prueba: bono, ventajas y etiqueta para mostrarla antes de tirar
function describirPrueba(p) {
  const h = estado.heroe;
  const r = { etiqueta: '', bono: 0, ventaja: !!p.ventaja, desventaja: !!p.desventaja, fuentes: [], guia: false, cd: p.cd };
  if (p.tipo === 'habilidad') {
    const hab = HABILIDADES[p.id];
    r.etiqueta = `Prueba de ${hab.nombre} (${ABREV_CAR[hab.car]})`;
    r.bono = bonoHabilidad(h, p.id);
    if (p.id === 'sigilo') {
      const arm = armaduraEquipada(h);
      if (arm && arm.sigiloDesv) { r.desventaja = true; r.fuentes.push('armadura ruidosa'); }
      if (objetosEquipados(h).some(it => OBJETOS[it.id].ventajaHab === 'sigilo')) { r.ventaja = true; r.fuentes.push('equipo élfico'); }
    }
    if (p.id === 'medicina' && contarObjeto(h, 'kit_sanador') > 0) { r.ventaja = true; r.fuentes.push('kit de sanador'); }
    if (hab.car === 'fue' && h.efectos.furia) r.ventaja = true;
  } else if (p.tipo === 'caracteristica') {
    r.etiqueta = `Prueba de ${NOMBRE_CAR[p.id]}`;
    r.bono = modCar(h, p.id);
  } else {
    r.etiqueta = `Salvación de ${NOMBRE_CAR[p.id]}`;
    r.bono = bonoSalvacion(h, p.id);
    if (p.id === 'des' && tieneRasgo(h, 'sentido_peligro')) { r.ventaja = true; r.fuentes.push('sentido del peligro'); }
  }
  if (p.tipo !== 'salvacion') {
    if (tieneCondicion(h, 'envenenado')) { r.desventaja = true; r.fuentes.push('envenenado'); }
    if (h.trucos.includes('guia')) { r.guia = true; r.fuentes.push('Guía +1d4'); }
  }
  if (p.ventaja) r.fuentes.push('ventaja del DM');
  if (p.desventaja) r.fuentes.push('desventaja del DM');
  return r;
}

async function realizarPrueba(p, animar) {
  const h = estado.heroe;
  const d = describirPrueba(p);
  let vent = d.ventaja;
  if (h.usarInspiracion && h.inspiracion) { vent = true; h.inspiracion = false; h.usarInspiracion = false; d.fuentes.push('inspiración'); }
  const t = tirarD20({ ventaja: vent, desventaja: d.desventaja, afortunado: !!RAZAS[h.raza].afortunado });
  if (animar) await animar(t, d.etiqueta);
  const extraGuia = d.guia ? dado(4) : 0;
  const total = t.valor + d.bono + extraGuia;
  const exito = p.cd != null ? total >= p.cd : null;
  const dadosTxt = t.dados.length > 1 ? `${t.dados.join(' y ')} (${t.modo})` : `${t.valor}`;
  const texto = `${d.etiqueta}${p.cd != null ? ` CD ${p.cd}` : ''}: d20 = ${dadosTxt} ${signo(d.bono)}${extraGuia ? ' +' + extraGuia + ' (Guía)' : ''} = ${total}${exito != null ? (exito ? ' → ÉXITO' : ' → FALLO') : ''}${t.valor === 20 ? ' (¡20 natural!)' : t.valor === 1 ? ' (1 natural)' : ''}`;
  registrarTirada(texto, exito === false ? 'malo' : exito ? 'bueno' : '');
  return { t, total, exito, texto, natural: t.valor };
}

function registrarTirada(texto, clase) {
  if (!estado.registro) estado.registro = [];
  estado.registro.unshift({ texto, clase, hora: Date.now() });
  if (estado.registro.length > 60) estado.registro.length = 60;
}

// Daño fuera de combate (trampas, eventos)
function danioFueraCombate(cantidad, tipo) {
  const h = estado.heroe, raza = RAZAS[h.raza];
  const resist = [...(raza.resist || [])];
  if (raza.aliento && h.linaje) resist.push(LINAJES_DRACONIDOS[h.linaje].danio);
  if (h.efectos.resistFuego) resist.push('fuego');
  let n = aplicarResistencias(tipo, cantidad, resist, [], [], true);
  if (h.pgTemp) { const a = Math.min(h.pgTemp, n); h.pgTemp -= a; n -= a; }
  h.pg -= n;
  let texto = `Sufres ${n} de daño${tipo ? ' de ' + tipo : ''}.`;
  if (h.pg <= 0) {
    if (estado.ajustes.dificultad === 'dificil' && -h.pg >= h.pgMax) { h.pg = 0; h.muerto = true; texto += ' El golpe es mortal.'; }
    else if (estado.ajustes.dificultad === 'dificil') {
      // Tiradas contra la muerte rápidas
      let ex = 0, fa = 0;
      while (ex < 3 && fa < 3) { const v = dado(20); if (v === 20) { ex = 3; break; } if (v >= 10) ex++; else fa += v === 1 ? 2 : 1; }
      if (fa >= 3) { h.pg = 0; h.muerto = true; texto += ' Caes inconsciente y no vuelves a despertar.'; }
      else { h.pg = 1; texto += ' Caes inconsciente, pero logras estabilizarte y despiertas con 1 PG.'; }
    } else { h.pg = 1; texto += ' Quedas al borde de la inconsciencia (1 PG).'; }
  }
  h.estadisticas.danioRecibido += n;
  return texto;
}

// Efectos que llegan del DM o de los eventos de la mazmorra. Devuelve líneas de texto para el registro.
function aplicarEfectos(efectos, origen = 'dm') {
  const h = estado.heroe;
  const lineas = [];
  let subida = false, descanso = null;
  for (const ef of (Array.isArray(efectos) ? efectos : [])) {
    if (!ef || typeof ef !== 'object') continue;
    const tipo = SIN_TILDES(ef.tipo).replace('dano', 'danio');
    switch (tipo) {
      case 'oro': {
        let n = Math.round(Number(ef.cantidad) || 0);
        n = limitar(n, -h.oro, origen === 'dm' ? 150 * h.nivel + 100 : 5000);
        if (!n) break;
        h.oro += n;
        lineas.push(n > 0 ? `+${n} po` : `${n} po`);
        break;
      }
      case 'objeto': {
        const id = ef.id && OBJETOS[ef.id] ? ef.id : null;
        const cant = limitar(parseInt(ef.cantidad || 1, 10) || 1, 1, 10);
        if (id) { anadirObjeto(h, id, cant); lineas.push(`Obtienes: ${OBJETOS[id].nombre}${cant > 1 ? ' ×' + cant : ''}`); }
        else if (ef.nombre) { anadirObjeto(h, String(ef.nombre).slice(0, 60), cant, false, { nombre: String(ef.nombre).slice(0, 60), descripcion: String(ef.descripcion || '').slice(0, 200) }); lineas.push(`Obtienes: ${String(ef.nombre).slice(0, 60)}`); }
        break;
      }
      case 'quitar_objeto': {
        const nombre = SIN_TILDES(ef.nombre || (ef.id && OBJETOS[ef.id] ? OBJETOS[ef.id].nombre : ef.id));
        const it = h.inventario.find(i => SIN_TILDES(nombreObjeto(i)) === nombre || i.id === ef.id) || h.inventario.find(i => SIN_TILDES(nombreObjeto(i)).includes(nombre) && nombre.length > 3);
        if (it) { lineas.push(`Pierdes: ${nombreObjeto(it)}`); quitarObjeto(h, it.uid, Math.min(it.cantidad, parseInt(ef.cantidad || 1, 10) || 1)); }
        break;
      }
      case 'danio': {
        const expr = ef.dados || ef.cantidad || '1d6';
        const t = tirarDados(String(expr).replace(/\s/g, ''));
        const n = Math.min(t.total, origen === 'dm' ? 8 * h.nivel + 10 : 999);
        lineas.push(danioFueraCombate(n, ef.danio || ef.tipoDanio || ''));
        break;
      }
      case 'curacion': {
        const n = ef.dados ? tirarDados(String(ef.dados)).total : (Number(ef.cantidad) || 0);
        if (n > 0) { const antes = h.pg; h.pg = Math.min(h.pgMax, h.pg + n); lineas.push(`Recuperas ${h.pg - antes} PG`); }
        break;
      }
      case 'px': {
        const tope = h.nivel < NIVEL_MAXIMO ? Math.max(50, Math.round((UMBRAL_PX[h.nivel + 1] - UMBRAL_PX[h.nivel]) * 0.35)) : 300;
        const n = limitar(Math.round(Number(ef.cantidad) || 0), 0, origen === 'dm' ? tope : 5000);
        if (n > 0) { subida = ganarPx(h, n) || subida; lineas.push(`+${n} PX${ef.motivo ? ' (' + String(ef.motivo).slice(0, 60) + ')' : ''}`); }
        break;
      }
      case 'condicion': {
        const id = SIN_TILDES(ef.condicion);
        if (['envenenado', 'asustado', 'derribado'].includes(id)) { ponerCondicion(h, id); lineas.push(`Quedas ${CONDICIONES[id].nombre.toLowerCase()}`); }
        break;
      }
      case 'quitar_condicion': {
        const id = SIN_TILDES(ef.condicion);
        if (tieneCondicion(h, id)) { quitarCondicion(h, id); lineas.push(`Ya no estás ${CONDICIONES[id] ? CONDICIONES[id].nombre.toLowerCase() : id}`); }
        break;
      }
      case 'inspiracion': if (!h.inspiracion) { h.inspiracion = true; lineas.push('Ganas inspiración ★'); } break;
      case 'descanso': descanso = SIN_TILDES(ef.clase) === 'largo' ? 'largo' : 'corto'; break;
    }
  }
  if (descanso === 'largo') { descansoLargo(h); lineas.push('Descanso largo: recuperas todos tus PG, espacios de conjuro y recursos.'); }
  if (descanso === 'corto') { descansoCorto(h); lineas.push('Descanso corto: recuperas tus recursos de descanso corto.'); }
  return { lineas, subida: subida || puedeSubirNivel(h), descanso };
}

function normalizarMonstruo(v) {
  if (!v) return null;
  const s = SIN_TILDES(v).replace(/\s+/g, '_');
  if (MONSTRUOS[s]) return s;
  for (const [id, m] of Object.entries(MONSTRUOS)) if (SIN_TILDES(m.nombre).replace(/\s+/g, '_') === s) return id;
  for (const [id, m] of Object.entries(MONSTRUOS)) if (s.includes(SIN_TILDES(m.nombre).replace(/\s+/g, '_')) || SIN_TILDES(m.nombre).replace(/\s+/g, '_').includes(s)) return id;
  return null;
}

const Hooks = {
  render() {},
  log() {},
  async dado(tirada, etiqueta) {},

  flotante(entId, texto, clase) {},
  async pausa(ms) {},

};

const ANCHO_MAPA = 12, ALTO_MAPA = 8;

const TERRENOS = {
  mazmorra: { nombre: 'Mazmorra', obstaculo: 'Pilar', n: [6, 10] },
  cripta: { nombre: 'Cripta', obstaculo: 'Sarcófago', n: [6, 10] },
  cueva: { nombre: 'Cueva', obstaculo: 'Roca', n: [8, 13] },
  bosque: { nombre: 'Bosque', obstaculo: 'Árbol', n: [8, 14] },
  templo: { nombre: 'Templo', obstaculo: 'Columna', n: [6, 9] },
  ciudad: { nombre: 'Calle', obstaculo: 'Carro', n: [5, 9] },
  taberna: { nombre: 'Taberna', obstaculo: 'Mesa', n: [7, 11] },
  llanura: { nombre: 'Campo abierto', obstaculo: 'Roca', n: [2, 5] },
  pantano: { nombre: 'Pantano', obstaculo: 'Fango profundo', n: [8, 13] },
  ruinas: { nombre: 'Ruinas', obstaculo: 'Escombros', n: [7, 12] },
  volcan: { nombre: 'Volcán', obstaculo: 'Lava', n: [6, 10] },
};

// ─── Geometría ───
function dist(a, b) { return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); }
function enMapa(x, y) { return x >= 0 && y >= 0 && x < ANCHO_MAPA && y < ALTO_MAPA; }
function esObstaculo(c, x, y) { return !enMapa(x, y) || c.celdas[y][x] === 1; }
function entEn(c, x, y) { return Object.values(c.ents).find(e => e.x === x && e.y === y && (e.id === 'heroe' || e.pg > 0)); }
function celdaLibre(c, x, y) { return enMapa(x, y) && !esObstaculo(c, x, y) && !entEn(c, x, y); }

function lineaCeldas(x0, y0, x1, y1) {
  const celdas = []; let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;) {
    celdas.push([x0, y0]);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
  return celdas;
}
function tieneCobertura(c, a, b) {
  const l = lineaCeldas(a.x, a.y, b.x, b.y);
  return l.slice(1, -1).some(([x, y]) => esObstaculo(c, x, y));
}

// BFS: distancias desde (x,y). bloqueaEnts: no se puede atravesar a los rivales.
function mapaDistancias(c, origen, opciones = {}) {
  const { vuela = false, bando = 'heroe' } = opciones;
  const d = Array.from({ length: ALTO_MAPA }, () => Array(ANCHO_MAPA).fill(Infinity));
  const previo = {};
  d[origen.y][origen.x] = 0;
  const cola = [[origen.x, origen.y]];
  while (cola.length) {
    const [x, y] = cola.shift();
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (!enMapa(nx, ny) || d[ny][nx] !== Infinity) continue;
      if (esObstaculo(c, nx, ny) && !vuela) continue;
      const o = entEn(c, nx, ny);
      if (o) {
        const rival = bando === 'heroe' ? o.id !== 'heroe' : o.id === 'heroe';
        if (rival) continue;
      }
      d[ny][nx] = d[y][x] + 1;
      previo[nx + ',' + ny] = [x, y];
      cola.push([nx, ny]);
    }
  }
  return { d, previo };
}
function reconstruirRuta(previo, origen, destino) {
  const ruta = []; let cur = [destino.x, destino.y];
  while (cur && !(cur[0] === origen.x && cur[1] === origen.y)) { ruta.unshift({ x: cur[0], y: cur[1] }); cur = previo[cur[0] + ',' + cur[1]]; }
  return ruta;
}

// Celdas de un área de efecto
function celdasArea(c, area, origen, objetivo) {
  const res = [];
  for (let y = 0; y < ALTO_MAPA; y++) for (let x = 0; x < ANCHO_MAPA; x++) {
    if (area.forma === 'esfera') {
      const dx = x - objetivo.x, dy = y - objetivo.y;
      if (dx * dx + dy * dy <= (area.tam + 0.5) * (area.tam + 0.5)) res.push({ x, y });
    } else if (area.forma === 'radio_yo') {
      if ((x !== origen.x || y !== origen.y) && dist({ x, y }, origen) <= area.tam) res.push({ x, y });
    } else if (area.forma === 'cono' || area.forma === 'linea') {
      if (x === origen.x && y === origen.y) continue;
      const vx = objetivo.x - origen.x, vy = objetivo.y - origen.y;
      const largo = Math.hypot(vx, vy) || 1;
      const ux = vx / largo, uy = vy / largo;
      const px = x - origen.x, py = y - origen.y;
      const proy = px * ux + py * uy;
      const perp = Math.abs(px * uy - py * ux);
      if (area.forma === 'cono') {
        if (proy > 0 && Math.hypot(px, py) <= area.tam + 0.5 && perp <= proy * 0.58 + 0.15) res.push({ x, y });
      } else if (proy > 0 && proy <= area.tam + 0.5 && perp <= 0.55) res.push({ x, y });
    }
  }
  return res;
}

// ─── Utilidades de entidades ───
function cmb() { return estado.combate; }
function heroeEnt() { return estado.combate.ents.heroe; }
function enemigos(c = cmb()) { return Object.values(c.ents).filter(e => e.id !== 'heroe'); }
function enemigosVivos(c = cmb()) { return enemigos(c).filter(e => e.pg > 0); }
function datosMonstruo(e) { return MONSTRUOS[e.mid]; }
function nombreEnt(e) { return e.id === 'heroe' ? estado.heroe.nombre : e.nombre; }
function incapacitado(e) { return ['paralizado', 'dormido', 'inconsciente'].some(id => tieneCondicion(e.id === 'heroe' ? estado.heroe : e, id)); }
function condicionesDe(e) { return e.id === 'heroe' ? estado.heroe : e; }

function log(html, clase = '') { const c = cmb(); if (c) { c.log.push({ html, clase }); if (c.log.length > 250) c.log.shift(); } Hooks.log(html, clase); }
function nombreHtml(e) { return `<b class="${e.id === 'heroe' ? 'n-heroe' : 'n-enemigo'}">${escaparHtml(nombreEnt(e))}</b>`; }
function textoTirada(t, bono) {
  const dados = t.dados.length > 1 ? `[${t.dados.join(' | ')}]` : t.valor;
  return `🎲${dados}${bono ? ' ' + signo(bono).replace('−', '− ') : ''}`;
}

// ─── Creación del combate ───
function siglas(nombre) {
  const p = nombre.split(/\s+/).filter(w => w.length > 2 || /^[A-ZÁÉÍÓÚ]/.test(w));
  return ((p[0] || nombre)[0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

function prepararEnemigos(lista) {
  const dif = DIFICULTADES[estado.ajustes.dificultad] || DIFICULTADES.normal;
  const ents = [];
  const conteo = {};
  for (const grupo of lista) {
    const m = MONSTRUOS[grupo.id];
    if (!m) continue;
    const cant = limitar(parseInt(grupo.cantidad || 1, 10) || 1, 1, 8);
    for (let i = 0; i < cant; i++) {
      conteo[grupo.id] = (conteo[grupo.id] || 0) + 1;
      const jefe = !!grupo.jefe;
      let pgMax = Math.max(1, Math.round(promedioDados(m.pg) * dif.pgEnemigos * (jefe ? 1.5 : 1) * (grupo.factorPg || 1)));
      ents.push({
        id: 'e' + ents.length, mid: grupo.id, nombre: grupo.nombre && cant === 1 ? grupo.nombre : m.nombre,
        corto: siglas(grupo.nombre && cant === 1 ? grupo.nombre : m.nombre), num: 0, jefe,
        pg: pgMax, pgMax, ca: m.ca + (jefe ? 1 : 0), px: Math.round(m.px * (jefe ? 1.5 : 1)),
        condiciones: [], reaccion: true, recargas: {}, usos: {}, actuo: false, x: 0, y: 0,
      });
    }
  }
  // Numerar enemigos repetidos
  const porNombre = {};
  ents.forEach(e => { porNombre[e.nombre] = (porNombre[e.nombre] || 0) + 1; });
  const idx = {};
  ents.forEach(e => { if (porNombre[e.nombre] > 1) { idx[e.nombre] = (idx[e.nombre] || 0) + 1; e.num = idx[e.nombre]; e.nombre = e.nombre + ' ' + e.num; } });
  for (const e of ents) {
    const m = MONSTRUOS[e.mid];
    for (const esp of (m.especiales || [])) { if (esp.recarga) e.recargas[esp.id] = true; if (esp.usos) e.usos[esp.id] = esp.usos; }
  }
  return ents;
}

function generarMapa(terreno, enemigosList) {
  const t = TERRENOS[terreno] || TERRENOS.mazmorra;
  for (let intento = 0; intento < 40; intento++) {
    const celdas = Array.from({ length: ALTO_MAPA }, () => Array(ANCHO_MAPA).fill(0));
    const n = t.n[0] + azar(t.n[1] - t.n[0] + 1);
    let puestos = 0, guard = 0;
    while (puestos < n && guard++ < 400) {
      const x = 2 + azar(ANCHO_MAPA - 4), y = azar(ALTO_MAPA);
      if (celdas[y][x]) continue;
      celdas[y][x] = 1; puestos++;
      // Algunos obstáculos ocupan dos casillas
      if (azar(3) === 0) { const nx = x + (azar(2) ? 1 : 0), ny = y + (azar(2) ? 1 : 0); if (nx < ANCHO_MAPA - 2 && ny < ALTO_MAPA) { celdas[ny][nx] = 1; } }
    }
    const c = { celdas, ents: {} };
    const hx = 1, hy = Math.floor(ALTO_MAPA / 2) - (azar(2));
    celdas[hy][hx] = 0;
    c.ents.heroe = { id: 'heroe', x: hx, y: hy };
    // Colocar enemigos: los de distancia atrás
    const ordenados = enemigosList.slice().sort((a, b) => (MONSTRUOS[b.mid].comportamiento === 'distancia') - (MONSTRUOS[a.mid].comportamiento === 'distancia'));
    let ok = true;
    for (const e of ordenados) {
      const atras = ['distancia', 'lanzador'].includes(MONSTRUOS[e.mid].comportamiento);
      let colocado = false;
      for (let k = 0; k < 80 && !colocado; k++) {
        const x = atras ? 9 + azar(3) : 7 + azar(3), y = azar(ALTO_MAPA);
        if (celdas[y][x] || Object.values(c.ents).some(o => o.x === x && o.y === y)) continue;
        e.x = x; e.y = y; c.ents[e.id] = e; colocado = true;
      }
      if (!colocado) { ok = false; break; }
    }
    if (!ok) continue;
    // Comprobar que todos pueden alcanzar al héroe
    const { d } = mapaDistancias(c, c.ents.heroe, { bando: 'nadie' });
    if (enemigosList.every(e => d[e.y][e.x] < Infinity)) return { celdas, ents: c.ents };
  }
  // Mapa vacío de emergencia
  const celdas = Array.from({ length: ALTO_MAPA }, () => Array(ANCHO_MAPA).fill(0));
  const ents = { heroe: { id: 'heroe', x: 1, y: 3 } };
  enemigosList.forEach((e, i) => { e.x = 9 + (i % 3); e.y = (i * 2) % ALTO_MAPA; ents[e.id] = e; });
  return { celdas, ents };
}

// Ajusta un encuentro al presupuesto de la dificultad elegida
function ajustarEncuentro(lista, nivel, esJefe = false) {
  const dif = DIFICULTADES[estado.ajustes.dificultad] || DIFICULTADES.normal;
  const umbrales = PRESUPUESTO_ENCUENTRO[nivel];
  const tope = (esJefe ? Math.max(umbrales[3], umbrales[dif.tope] * 1.5) : umbrales[dif.tope]) * 1.25;
