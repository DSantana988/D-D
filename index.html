    case 'curar': { const t = tirarDados(o.dados); const g = curarHeroe(t.total); return { texto: `Usas ${o.nombre}: recuperas ${g} PG.` }; }
    case 'antidoto': quitarCondicion(h, 'envenenado'); return { texto: 'El antídoto limpia tu sangre.' };
    case 'fuerza_gigante': h.efectos.fuerzaGigante = true; return { texto: 'Tus músculos se hinchan: FUE 21 durante el próximo combate.' };
    case 'heroismo': h.pgTemp = Math.max(h.pgTemp, 10); h.efectos.bendicion = true; h.efectos.heroismo = true; return { texto: 'Te sientes invencible: 10 PG temporales y bendecido.' };
    case 'resist_fuego': h.efectos.resistFuego = true; return { texto: 'Tu piel se enfría: resistencia al fuego hasta el próximo descanso largo.' };
    case 'arrojar': return { arrojar: true, texto: `Arrojas ${o.nombre}.`, clase: 'nota' };
  }
  return { texto: `Usas ${o.nombre}.` };
}

// ─── Fin del combate ───
async function terminarCombate() {
  const c = cmb(), h = estado.heroe;
  if (!c || c.cerrado) return;
  c.cerrado = true;
  c.esperandoJugador = false;
  // Limpieza de efectos de combate
  if (h.efectos.concentracion) finConcentracion();
  h.efectos.furia = false; h.efectos.armaSagrada = false; h.efectos.escudoReaccion = false; h.efectos.fuerzaGigante = false;
  if (h.efectos.heroismo) { h.efectos.heroismo = false; h.efectos.bendicion = false; }
  h.efectos.toqueVampirico = null; h.efectos.marca = null; h.efectos.castigo = null;
  h.condiciones = (h.condiciones || []).filter(x => ['envenenado'].includes(x.id));
  h.reaccion = true;
  const res = { resultado: c.resultado, px: 0, oro: 0, objetos: [], derrotados: c.derrotados.slice(), ronda: c.ronda };
  if (c.resultado === 'victoria') {
    res.px = c.pxGanados;
    // Botín: oro según los humanoides y su peligrosidad
    let oro = 0;
    for (const e of enemigos(c)) {
      const m = datosMonstruo(e);
      if (['humanoide', 'gigante', 'dragon'].includes(m.tipo)) oro += Math.round(e.px / 10 * (0.5 + Math.random()));
      if (m.tipo === 'dragon') oro += 150 + azar(150);
      if (e.jefe) oro += 20 + azar(40);
    }
    res.oro = oro;
    const tiradaBotin = azar(100);
    const hayJefe = enemigos(c).some(e => e.jefe || MONSTRUOS[e.mid].px >= 700);
    if (hayJefe) res.objetos.push(elegir(h.nivel >= 3 ? BOTIN_RARO : BOTIN_MEDIO));
    else if (tiradaBotin < 30) res.objetos.push(elegir(BOTIN_COMUN));
    else if (tiradaBotin < 38) res.objetos.push(elegir(BOTIN_MEDIO));
    h.oro += res.oro;
    for (const id of res.objetos) anadirObjeto(h, id, 1);
    ganarPx(h, res.px);
    log(`<span class="l-titulo">¡Victoria!</span> +${res.px} PX${res.oro ? `, +${res.oro} po` : ''}${res.objetos.length ? ', ' + res.objetos.map(id => OBJETOS[id].nombre).join(', ') : ''}.`, 'critico');
  } else if (c.resultado === 'derrota') {
    h.caido = false; h.pg = Math.max(1, h.pg); h.muerte = { exitos: 0, fallos: 0 };
    quitarCondicion(h, 'inconsciente');
    ganarPx(h, Math.floor(c.pxGanados));
    res.px = c.pxGanados;
    log('Caes derrotado...', 'malo');
  } else if (c.resultado === 'huida') {
    ganarPx(h, c.pxGanados); res.px = c.pxGanados;
  } else if (c.resultado === 'muerte') {
    h.muerto = true;
    log('<span class="l-titulo">Has muerto.</span>', 'malo');
  }
  c.resumen = res;
  Hooks.render();
  Hooks.finCombate(c);
}

// Resumen del combate para el DM
function textoResultadoCombate(c) {
  const r = c.resumen, h = estado.heroe;
  const nombres = {};
  enemigos(c).forEach(e => { nombres[e.nombre] = e.pg > 0 ? 'vivo' : 'derrotado'; });
  const lista = Object.entries(nombres).map(([n, s]) => `${n} (${s})`).join(', ');
  const base = `Enemigos: ${lista}. Duró ${r.ronda} asaltos. El héroe queda con ${h.pg}/${h.pgMax} PG.`;
  switch (r.resultado) {
    case 'victoria': return `[COMBATE TERMINADO: VICTORIA] ${base} El motor ya entregó ${r.px} PX${r.oro ? ', ' + r.oro + ' po' : ''}${r.objetos.length ? ' y ' + r.objetos.map(id => OBJETOS[id].nombre).join(', ') : ''}. Narra brevemente el final del combate y lo que el héroe encuentra o ve después.`;
    case 'derrota': return `[COMBATE TERMINADO: DERROTA] ${base} El héroe cayó inconsciente y se ha estabilizado. Decide qué hacen los enemigos con él (capturarlo, robarle, abandonarlo...). Consecuencias duras pero no mortales; el héroe despierta con 1 PG.`;
    case 'huida': return `[COMBATE TERMINADO: HUIDA] ${base} El héroe ha escapado del combate. Los enemigos supervivientes siguen ahí y pueden perseguirlo.`;
    case 'muerte': return '[EL HÉROE HA MUERTO]';
  }
  return base;
}

// ── mazmorra.js ──
// ─── Mazmorra clásica: generación de pisos, salas y eventos ───

const MAPA_W = 5, MAPA_H = 4;
const DIRECCIONES = [{ dx: 0, dy: -1, nombre: 'norte' }, { dx: 1, dy: 0, nombre: 'este' }, { dx: 0, dy: 1, nombre: 'sur' }, { dx: -1, dy: 0, nombre: 'oeste' }];

function nuevaMazmorra() {
  estado.mazmorra = { piso: 0, salas: {}, actual: null, anterior: null, mapaRevelado: false, descansoCortoUsado: false, pendiente: null, completada: false, narracion: [] };
  generarPiso(0);
}

function generarPiso(indice) {
  const mz = estado.mazmorra, piso = PISOS[indice];
  mz.piso = indice; mz.salas = {}; mz.mapaRevelado = false; mz.descansoCortoUsado = false; mz.pendiente = null; mz.narracion = [];
  const objetivo = 8 + azar(3);
  const clave = (x, y) => x + ',' + y;
  const inicio = { x: 0, y: azar(MAPA_H) };
  const salas = {};
  const crear = (x, y) => { const id = 's' + Object.keys(salas).length; salas[clave(x, y)] = { id, x, y, tipo: 'vacia', conexiones: [], visitada: false, resuelta: false }; return salas[clave(x, y)]; };
  const conectar = (a, b) => { if (!a.conexiones.includes(b.id)) a.conexiones.push(b.id); if (!b.conexiones.includes(a.id)) b.conexiones.push(a.id); };
  crear(inicio.x, inicio.y);
  let guard = 0;
  while (Object.keys(salas).length < objetivo && guard++ < 500) {
    const base = elegir(Object.values(salas));
    const d = elegir(DIRECCIONES);
    const nx = base.x + d.dx, ny = base.y + d.dy;
    if (nx < 0 || ny < 0 || nx >= MAPA_W || ny >= MAPA_H) continue;
    if (salas[clave(nx, ny)]) { if (azar(6) === 0) conectar(base, salas[clave(nx, ny)]); continue; }
    conectar(base, crear(nx, ny));
  }
  const lista = Object.values(salas);
  const porId = Object.fromEntries(lista.map(s => [s.id, s]));
  // Distancias desde la entrada para colocar al jefe en la sala más lejana
  const distancia = { [lista[0].id]: 0 }; const cola = [lista[0].id];
  while (cola.length) { const id = cola.shift(); for (const v of porId[id].conexiones) if (distancia[v] == null) { distancia[v] = distancia[id] + 1; cola.push(v); } }
  const entrada = lista[0];
  const jefe = lista.slice(1).sort((a, b) => distancia[b.id] - distancia[a.id] || b.x - a.x)[0];
  entrada.tipo = 'entrada'; entrada.resuelta = true; entrada.visitada = true;
  jefe.tipo = 'jefe';
  const resto = barajar(lista.filter(s => s !== entrada && s !== jefe));
  const tipos = ['combate', 'combate', 'evento', 'combate', 'tesoro', 'trampa', 'evento', 'santuario', 'mercader', 'combate', 'evento', 'vacia'];
  const eventos = barajar(EVENTOS.map(e => e.id));
  resto.forEach((s, i) => {
    s.tipo = tipos[i] || 'vacia';
    if (s.tipo === 'evento') s.evento = eventos.pop();
    if (s.tipo === 'trampa') s.trampa = azar(TRAMPAS.length);
  });
  // El santuario nunca justo antes del jefe: si es vecino, se intercambia con un combate
  for (const s of lista) s.desc = elegir(DESCRIPCIONES_SALA[piso.terreno] || DESCRIPCIONES_SALA.cripta);
  mz.salas = porId;
  mz.actual = entrada.id; mz.anterior = null;
  narrar(`<b>${escaparHtml(piso.nombre)}</b> ${escaparHtml(piso.intro)}`, 'titulo');
}

function salaActual() { const mz = estado.mazmorra; return mz.salas[mz.actual]; }
function pisoActual() { return PISOS[estado.mazmorra.piso]; }
function narrar(html, clase = '') { const mz = estado.mazmorra; mz.narracion.push({ html, clase }); if (mz.narracion.length > 80) mz.narracion.shift(); }

function salasVecinas() {
  const s = salaActual();
  return s.conexiones.map(id => estado.mazmorra.salas[id]);
}
function direccionHacia(a, b) {
  const d = DIRECCIONES.find(d => a.x + d.dx === b.x && a.y + d.dy === b.y);
  return d ? d.nombre : 'adelante';
}
function puedeMoverse() {
  const mz = estado.mazmorra, s = salaActual();
  return !mz.pendiente && (s.resuelta || s.tipo === 'vacia' || s.tipo === 'entrada');
}

function indiceDificultad() {
  const d = estado.ajustes.dificultad;
  if (d === 'facil') return 1;
  if (d === 'dificil') return azar(4) === 0 ? 3 : 2;
  return azar(3) === 0 ? 2 : 1;
}

function generarEncuentro(pool, nivel, indice) {
  const objetivo = PRESUPUESTO_ENCUENTRO[nivel][indice];
  const coste = gs => { const n = gs.reduce((s, g) => s + g.cantidad, 0); return gs.reduce((s, g) => s + MONSTRUOS[g.id].px * g.cantidad, 0) * multiplicadorGrupo(n); };
  let mejor = null;
  for (let intento = 0; intento < 80; intento++) {
    const primero = elegir(pool);
    if (MONSTRUOS[primero].px > objetivo) continue;
    let grupos = [{ id: primero, cantidad: 1 }];
    for (let k = 0; k < 7; k++) {
      const cand = azar(3) === 0 ? elegir(pool) : grupos[0].id;
      const prueba = grupos.map(g => Object.assign({}, g));
      const ex = prueba.find(g => g.id === cand);
      if (ex) ex.cantidad++; else prueba.push({ id: cand, cantidad: 1 });
      if (coste(prueba) <= objetivo * 1.1) grupos = prueba; else break;
    }
    const cst = coste(grupos);
    if (!mejor || Math.abs(objetivo - cst) < Math.abs(objetivo - mejor.c)) mejor = { grupos, c: cst };
  }
  if (!mejor) {
    const debil = pool.slice().sort((a, b) => MONSTRUOS[a].px - MONSTRUOS[b].px)[0];
    mejor = { grupos: [{ id: debil, cantidad: 1 }] };
  }
  return mejor.grupos;
}

// Entrar en una sala: devuelve una acción para la interfaz ({tipo:'combate', def} o null)
function entrarSala(id) {
  const mz = estado.mazmorra, h = estado.heroe;
  const destino = mz.salas[id];
  if (!destino || !salaActual().conexiones.includes(id) || !puedeMoverse()) return null;
  mz.anterior = mz.actual;
  mz.actual = id;
  const piso = pisoActual();
  const primeraVez = !destino.visitada;
  destino.visitada = true;
  narrar(`Avanzas hacia el ${direccionHacia(mz.salas[mz.anterior], destino)}. ${escaparHtml(destino.desc)}`);
  if (destino.resuelta) return null;
  switch (destino.tipo) {
    case 'combate': {
      const grupos = destino.grupos || generarEncuentro(piso.monstruos, h.nivel, indiceDificultad());
      destino.grupos = grupos;
      narrar(escaparHtml(elegir(INTROS_COMBATE)), 'peligro');
      return { tipo: 'combate', def: { enemigos: grupos, terreno: piso.terreno, sorpresa: primeraVez && azar(8) === 0 ? 'heroe' : null } };
    }
    case 'jefe': {
      narrar(escaparHtml(piso.jefe.texto), 'peligro');
      return { tipo: 'combate', def: { enemigos: piso.jefe.grupos, terreno: piso.terreno, jefe: true } };
    }
    case 'evento': {
      const ev = EVENTOS.find(e => e.id === destino.evento);
      narrar(`<b>${escaparHtml(ev.titulo)}</b>. ${escaparHtml(ev.texto)}`, 'evento');
      mz.pendiente = { tipo: 'evento', evento: ev.id };
      return null;
    }
    case 'trampa': {
      const tr = TRAMPAS[destino.trampa];
      const cd = 12 + mz.piso;
      narrar(`<b>${escaparHtml(tr.titulo)}</b>. ${escaparHtml(tr.texto)}`, 'evento');
      if (percepcionPasiva(h) >= cd + 2) {
        narrar('Tu instinto te alerta: aquí hay una trampa.', 'bueno');
        mz.pendiente = { tipo: 'trampa', fase: 'detectada', cd };
      } else mz.pendiente = { tipo: 'trampa', fase: 'inicio', cd };
      return null;
    }
    case 'tesoro': {
      const oro = (mz.piso + 1) * 20 + tirarDados('2d20').total;
      const ef = [{ tipo: 'oro', cantidad: oro }];
      const r = azar(100);
      const obj = r < 45 ? elegir(BOTIN_COMUN) : r < 75 ? elegir(BOTIN_MEDIO) : (mz.piso >= 2 ? elegir(BOTIN_RARO) : elegir(BOTIN_MEDIO));
      ef.push({ tipo: 'objeto', id: obj });
      if (mz.piso === 4 && azar(3) === 0) ef.push({ tipo: 'objeto', id: elegir(BOTIN_LEGENDARIO) });
      const res = aplicarEfectos(ef, 'mazmorra');
      narrar(`Un cofre olvidado entre los escombros. ${res.lineas.join('. ')}.`, 'bueno');
      destino.resuelta = true;
      return { tipo: 'subida', subida: res.subida };
    }
    case 'santuario': {
      narrar('Una pequeña capilla intacta. Una llama blanca arde en el altar y el aire es limpio. Aquí estás a salvo.', 'bueno');
      mz.pendiente = { tipo: 'santuario', usado: false };
      return null;
    }
    case 'mercader': {
      const stock = barajar(INVENTARIO_TIENDA).slice(0, 8);
      if (mz.piso >= 1) stock.push(...barajar(BOTIN_MEDIO).slice(0, 2));
      if (mz.piso >= 2) stock.push(...barajar(BOTIN_RARO).slice(0, 2));
      if (!stock.includes('pocion_curacion')) stock.unshift('pocion_curacion');
      narrar('Un mercader encorvado ha montado un puesto entre las sombras, protegido por un círculo de sal. «Todo tiene un precio, viajero.»', 'evento');
      mz.pendiente = { tipo: 'mercader', stock: Array.from(new Set(stock)) };
      return null;
    }
    default: {
      if (azar(3) === 0) { const oro = tirarDados('2d6').total * (mz.piso + 1); estado.heroe.oro += oro; narrar(`Entre el polvo encuentras ${oro} po.`, 'bueno'); }
      destino.resuelta = true;
      return null;
    }
  }
}

// El daño de trampas y eventos crece con la profundidad: un dado menos en el primer piso, uno más en el último
function escalarDados(expr, piso) {
  return String(expr).replace(/^(\d+)d(\d+)/, (m, n, c) => `${Math.max(1, parseInt(n, 10) - 1 + Math.floor(piso / 2))}d${c}`);
}

// Convierte los efectos de los eventos al formato común
function convertirEfectosEvento(lista) {
  const mz = estado.mazmorra;
  const res = []; let combate = null;
  for (const e of lista || []) {
    if (e.oro) res.push({ tipo: 'oro', cantidad: tirarDados(String(e.oro)).total });
    if (e.objeto) {
      let id = e.objeto;
      if (id === 'comun') id = elegir(BOTIN_COMUN);
      else if (id === 'medio') id = elegir(BOTIN_MEDIO);
      else if (id === 'raro') id = elegir(BOTIN_RARO);
      else if (id === 'pergamino') id = elegir(['pergamino_proyectil', 'pergamino_curar', 'pergamino_rayo', 'pergamino_paso', mz.piso >= 2 ? 'pergamino_bola_fuego' : 'pergamino_proyectil']);
      res.push({ tipo: 'objeto', id, cantidad: e.cantidad || 1 });
    }
    if (e.danio) res.push({ tipo: 'danio', dados: escalarDados(e.danio, mz.piso), danio: e.tipo });
    if (e.curar) res.push({ tipo: 'curacion', dados: e.curar });
    if (e.px) res.push({ tipo: 'px', cantidad: e.px * (mz.piso + 1) });
    if (e.condicion) res.push({ tipo: 'condicion', condicion: e.condicion });
    if (e.inspiracion) res.push({ tipo: 'inspiracion' });
    if (e.mapa) mz.mapaRevelado = true;
    if (e.combate) combate = e.combate === 'aleatorio' ? generarEncuentro(pisoActual().monstruos, estado.heroe.nivel, 1) : e.combate;
  }
  return { efectos: res, combate };
}

// Resuelve una opción de evento. animar(t, etiqueta) muestra el dado.
async function resolverOpcionEvento(indice, animar) {
  const mz = estado.mazmorra, h = estado.heroe;
  const p = mz.pendiente;
  if (!p || p.tipo !== 'evento') return null;
  const ev = EVENTOS.find(e => e.id === p.evento);
  const op = ev.opciones[indice];
  if (!op) return null;
  if (op.coste) { if (h.oro < op.coste) return { error: 'No tienes suficiente oro.' }; h.oro -= op.coste; }
  let rama = op.exito, tiradaTxt = '';
  // Los cofres de pisos profundos pueden ser mimetos
  if (op.mimeto && mz.piso >= 2 && azar(5) === 0) {
    narrar(`<i>${escaparHtml(op.texto)}.</i> En cuanto tocas el cofre, ¡le salen dientes!`, 'peligro');
    mz.pendiente = null; salaActual().resuelta = true;
    return { combate: { enemigos: [{ id: 'mimeto' }], terreno: pisoActual().terreno } };
  }
  if (op.prueba) {
    const pr = Object.assign({}, op.prueba, { cd: op.prueba.cd + mz.piso });
    const r = await realizarPrueba(pr, animar);
    tiradaTxt = r.texto;
    rama = r.exito ? op.exito : op.fallo;
  } else if (op.azar) {
    rama = elegirPonderado(op.azar.map(a => [a, a.peso]));
  }
  const conv = convertirEfectosEvento(rama.efectos);
  const res = aplicarEfectos(conv.efectos, 'mazmorra');
  narrar(`<i>${escaparHtml(op.texto)}.</i> ${tiradaTxt ? '<span class="tirada-txt">' + escaparHtml(tiradaTxt) + '</span> ' : ''}${escaparHtml(rama.texto)}${res.lineas.length ? ' <b>' + escaparHtml(res.lineas.join('. ')) + '.</b>' : ''}`, 'evento');
  mz.pendiente = null;
  salaActual().resuelta = true;
  if (conv.combate) return { combate: { enemigos: conv.combate, terreno: pisoActual().terreno }, subida: res.subida };
  return { subida: res.subida };
}

async function resolverTrampa(accion, animar) {
  const mz = estado.mazmorra, h = estado.heroe;
  const p = mz.pendiente;
  if (!p || p.tipo !== 'trampa') return null;
  const tr = TRAMPAS[salaActual().trampa];
  const disparar = async () => {
    narrar(escaparHtml(tr.resultado), 'peligro');
    const r = await realizarPrueba({ tipo: 'salvacion', id: tr.salv, cd: p.cd }, animar);
    const dados = escalarDados(tr.danio, mz.piso);
    const t = tirarDados(dados);
    const n = r.exito ? Math.floor(t.total / 2) : t.total;
    const txt = danioFueraCombate(n, tr.tipo);
    if (!r.exito && tr.condicion) ponerCondicion(h, tr.condicion);
    narrar(`<span class="tirada-txt">${escaparHtml(r.texto)}</span> ${escaparHtml(txt)}${!r.exito && tr.condicion ? ' Quedas envenenado.' : ''}`, r.exito ? 'nota' : 'malo');
    mz.pendiente = null; salaActual().resuelta = true;
  };
  if (accion === 'buscar') {
    const hab = bonoHabilidad(h, 'investigacion') > bonoHabilidad(h, 'percepcion') ? 'investigacion' : 'percepcion';
    const r = await realizarPrueba({ tipo: 'habilidad', id: hab, cd: p.cd }, animar);
    if (r.exito) { narrar(`<span class="tirada-txt">${escaparHtml(r.texto)}</span> Descubres el mecanismo de la trampa.`, 'bueno'); p.fase = 'detectada'; return {}; }
    narrar(`<span class="tirada-txt">${escaparHtml(r.texto)}</span> No ves nada raro y avanzas...`, 'nota');
    await disparar(); return {};
  }
  if (accion === 'avanzar') { await disparar(); return {}; }
  if (accion === 'desactivar') {
    const r = await realizarPrueba({ tipo: 'habilidad', id: 'juego_manos', cd: p.cd }, animar);
    if (r.exito) {
      const res = aplicarEfectos([{ tipo: 'px', cantidad: 25 * (mz.piso + 1) }], 'mazmorra');
      narrar(`<span class="tirada-txt">${escaparHtml(r.texto)}</span> Desactivas la trampa. <b>${escaparHtml(res.lineas.join('. '))}.</b>`, 'bueno');
      mz.pendiente = null; salaActual().resuelta = true; return { subida: res.subida };
    }
    narrar(`<span class="tirada-txt">${escaparHtml(r.texto)}</span> Algo hace clic bajo tus dedos...`, 'malo');
    await disparar(); return {};
  }
  if (accion === 'rodear') {
    const r = await realizarPrueba({ tipo: 'habilidad', id: 'acrobacias', cd: p.cd - 2 }, animar);
    if (r.exito) { narrar(`<span class="tirada-txt">${escaparHtml(r.texto)}</span> Rodeas la trampa sin tocarla.`, 'bueno'); mz.pendiente = null; salaActual().resuelta = true; return {}; }
    narrar(`<span class="tirada-txt">${escaparHtml(r.texto)}</span> Pierdes el equilibrio...`, 'malo');
    await disparar(); return {};
  }
  return null;
}

function usarSantuario(accion) {
  const mz = estado.mazmorra, h = estado.heroe;
  const p = mz.pendiente;
  if (!p || p.tipo !== 'santuario') return;
  if (accion === 'descansar' && !p.usado) {
    descansoLargo(h); p.usado = true;
    narrar('Duermes bajo la llama blanca. Despiertas descansado: recuperas todos tus PG, espacios y recursos.', 'bueno');
  }
  if (accion === 'rezar') {
    h.condiciones = []; narrar('Rezas ante la llama. Tus males se disipan.', 'bueno');
  }
  if (accion === 'salir') { mz.pendiente = null; salaActual().resuelta = true; }
}

function cerrarMercader() { const mz = estado.mazmorra; mz.pendiente = null; salaActual().resuelta = true; }

// Descanso corto de la mazmorra: una vez por piso y con riesgo de ser interrumpido
function intentarDescansoCorto() {
  const mz = estado.mazmorra, h = estado.heroe;
  if (mz.descansoCortoUsado || !puedeMoverse()) return { error: 'No puedes descansar ahora.' };
  mz.descansoCortoUsado = true;
  if (azar(4) === 0) {
    narrar('Apenas cierras los ojos, oyes pasos. ¡Te han encontrado!', 'peligro');
    return { combate: { enemigos: generarEncuentro(pisoActual().monstruos, h.nivel, 1), terreno: pisoActual().terreno, sorpresa: 'heroe' } };
  }
  descansoCorto(h);
  narrar('Descansas una hora en silencio. Recuperas tus recursos de descanso corto.', 'bueno');
  return { descanso: true };
}

// Tras un combate en la mazmorra
function resolverCombateMazmorra(resumen) {
  const mz = estado.mazmorra, h = estado.heroe;
  const sala = salaActual();
  if (resumen.resultado === 'victoria') {
    sala.resuelta = true; sala.grupos = null;
    narrar(`Victoria. ${resumen.px ? '+' + resumen.px + ' PX. ' : ''}${resumen.oro ? '+' + resumen.oro + ' po. ' : ''}${resumen.objetos.length ? 'Botín: ' + resumen.objetos.map(id => OBJETOS[id].nombre).join(', ') + '.' : ''}`, 'bueno');
    if (sala.tipo === 'jefe') {
      if (mz.piso >= PISOS.length - 1) { mz.completada = true; narrar('¡Has conquistado la mazmorra entera!', 'titulo'); }
      else narrar('Tras la batalla descubres unas escaleras que descienden aún más.', 'bueno');
    }
  } else if (resumen.resultado === 'derrota') {
    const perdido = Math.floor(h.oro * 0.25);
    h.oro -= perdido;
    const entrada = Object.values(mz.salas).find(s => s.tipo === 'entrada');
    mz.actual = entrada.id; mz.pendiente = null;
    narrar(`Despiertas horas después junto a la entrada del nivel, magullado y con ${perdido} po menos. Tus enemigos siguen ahí.`, 'malo');
  } else if (resumen.resultado === 'huida') {
    if (mz.anterior) mz.actual = mz.anterior;
    narrar('Escapas por donde viniste. Tus enemigos siguen en esa sala.', 'nota');
  }
}

function descenderPiso() {
  const mz = estado.mazmorra;
  if (salaActual().tipo !== 'jefe' || !salaActual().resuelta || mz.piso >= PISOS.length - 1) return false;
  descansoLargo(estado.heroe);
  generarPiso(mz.piso + 1);
  narrar('Acampas en la escalera antes de bajar y descansas toda la noche.', 'nota');
  return true;
}

function textoVisibleStream(texto) {
  const i = texto.indexOf('@@@');
  let v = i >= 0 ? texto.slice(0, i) : texto;
  v = v.replace(/@{1,2}\s*$/, '').replace(/```[a-z]*\s*$/i, '');
  // Si el modelo empieza a escribir JSON sin el separador, ocultarlo
  const j = v.search(/\n\s*\{\s*"/);
  if (j >= 0) v = v.slice(0, j);
  return v.trim();
}

function parsearJsonTolerante(s) {
  if (!s) return null;
  let t = String(s).replace(/```(json)?/gi, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  t = t.slice(a, b + 1);
  try { return JSON.parse(t); } catch (e) { /* reparar */ }
  try { return JSON.parse(t.replace(/,\s*([}\]])/g, '$1').replace(/[“”]/g, '"')); } catch (e) { return null; }
}

function analizarRespuesta(texto) {
  let narracion = texto, datos = null;
  const i = texto.indexOf('@@@');
  if (i >= 0) { narracion = texto.slice(0, i); datos = parsearJsonTolerante(texto.slice(i + 3)); }
  else {
    const j = texto.search(/\n\s*(```json\s*)?\{\s*"/);
    if (j >= 0) { datos = parsearJsonTolerante(texto.slice(j)); if (datos) narracion = texto.slice(0, j); }
  }
  narracion = narracion.replace(/```[\s\S]*?```/g, '').trim();
  return { narracion, datos: datos && typeof datos === 'object' ? datos : {} };
}

function validarTirada(t) {
  if (!t || typeof t !== 'object') return null;
  const tipo = SIN_TILDES(t.tipo);
  const cd = limitar(Math.round(Number(t.cd) || 12), 5, 30);
  const base = { cd, motivo: String(t.motivo || '').slice(0, 140), ventaja: !!t.ventaja, desventaja: !!t.desventaja };
  if (tipo === 'habilidad' || (!tipo && t.habilidad)) { const id = normalizarHabilidad(t.habilidad); if (id) return Object.assign(base, { tipo: 'habilidad', id }); const car = normalizarCaracteristica(t.habilidad); if (car) return Object.assign(base, { tipo: 'caracteristica', id: car }); return null; }
  if (tipo === 'salvacion') { const id = normalizarCaracteristica(t.caracteristica || t.habilidad); return id ? Object.assign(base, { tipo: 'salvacion', id }) : null; }
  if (tipo === 'caracteristica' || tipo === 'prueba') { const id = normalizarCaracteristica(t.caracteristica || t.habilidad); if (id) return Object.assign(base, { tipo: 'caracteristica', id }); const hab = normalizarHabilidad(t.habilidad || t.caracteristica); return hab ? Object.assign(base, { tipo: 'habilidad', id: hab }) : null; }
  return null;
}

function validarCombate(cb) {
  if (!cb || typeof cb !== 'object' || !Array.isArray(cb.enemigos)) return null;
  const enemigos = [];
  for (const e of cb.enemigos.slice(0, 6)) {
    const id = normalizarMonstruo(e.id || e.nombre);
    if (!id) continue;
    enemigos.push({ id, cantidad: limitar(parseInt(e.cantidad || 1, 10) || 1, 1, 8), nombre: e.nombre && SIN_TILDES(e.nombre) !== SIN_TILDES(MONSTRUOS[id].nombre) ? String(e.nombre).slice(0, 40) : null, jefe: !!e.jefe });
  }
  if (!enemigos.length) return null;
  const terreno = TERRENOS[SIN_TILDES(cb.terreno)] ? SIN_TILDES(cb.terreno) : 'mazmorra';
  const s = SIN_TILDES(cb.sorpresa);
  return { enemigos, terreno, sorpresa: s === 'heroe' || s === 'enemigos' ? s : null };
}

// Procesa la respuesta completa del DM y actualiza el estado
function procesarRespuestaDM(texto) {
  const dm = estado.dm;
  const { narracion, datos } = analizarRespuesta(texto);
  const salida = { subida: false };
  dm.vista.push({ tipo: 'dm', texto: narracion || '…' });
  if (datos.lugar) dm.lugar = String(datos.lugar).slice(0, 80);
  if (datos.mision) dm.mision = String(datos.mision).slice(0, 160);
  if (Array.isArray(datos.diario)) {
    for (const d of datos.diario.slice(0, 4)) { const s = String(d).trim().slice(0, 200); if (s && !dm.diario.includes(s)) dm.diario.push(s); }
    if (dm.diario.length > 40) dm.diario.splice(0, dm.diario.length - 40);
  }
  dm.opciones = Array.isArray(datos.opciones) ? datos.opciones.slice(0, 4).map(o => String(o).slice(0, 90)).filter(Boolean) : [];
  if (Array.isArray(datos.efectos) && datos.efectos.length) {
    const r = aplicarEfectos(datos.efectos, 'dm');
    if (r.lineas.length) dm.vista.push({ tipo: 'efectos', lineas: r.lineas });
    salida.subida = r.subida;
    if (r.descanso === 'corto') salida.descansoCorto = true;
  }
  dm.tienda = Array.isArray(datos.tienda) ? datos.tienda.filter(id => OBJETOS[id] && id !== 'baya').slice(0, 14) : null;
  if (dm.tienda && !dm.tienda.length) dm.tienda = null;
  const combate = validarCombate(datos.combate);
  const tirada = combate ? null : validarTirada(datos.tirada);
  if (combate) { dm.pendiente = { tipo: 'combate', def: combate }; dm.opciones = []; }
  else if (tirada) { dm.pendiente = { tipo: 'tirada', prueba: tirada }; dm.opciones = []; }
  else dm.pendiente = null;
  if (SIN_TILDES(datos.fin) === 'victoria') dm.fin = 'victoria';
  // Guardar en el historial en forma compacta
  const compacto = Object.assign({}, datos);
  delete compacto.diario;
  dm.historial.push({ role: 'assistant', content: `${narracion}\n@@@\n${JSON.stringify(compacto)}` });
  if (dm.historial.length > MAX_TURNOS_HISTORIAL * 2) dm.historial.splice(0, dm.historial.length - MAX_TURNOS_HISTORIAL * 2);
  return salida;
}

  not_declared: 'El DM con IA no está disponible en esta versión de la página.',
  cancelled: 'Has detenido al DM.',
};

// Envía un mensaje del jugador al DM. onTexto(textoVisible) recibe el streaming.
async function enviarAlDM(mensaje, onTexto) {
  const dm = estado.dm;
  if (!DM.sample) { dm.error = { code: 'capability_disabled', texto: TEXTOS_ERROR_DM.capability_disabled }; return { error: dm.error }; }
  if (dm.cargando) return { error: { code: 'ocupado' } };
  const notas = dm.notas.length ? '(' + dm.notas.join(' ') + ')\n' : '';
  const completo = notas + mensaje;
  dm.cargando = true; dm.error = null; dm.ultimoMensaje = mensaje;
  const ctl = new AbortController();
  DM.ctl = ctl;
  try {
    const entrada = construirEntrada(completo);
    const tier = estado.ajustes.modeloDM || 'quick';
    const r = await DM.sample(entrada, { cache: false, modelTier: tier, signal: ctl.signal, onText: ({ text }) => { if (onTexto) onTexto(textoVisibleStream(text)); } });
    dm.notas = [];
    dm.historial.push({ role: 'user', content: completo });
    const salida = procesarRespuestaDM(r.text);
    if (r.truncated) dm.vista.push({ tipo: 'sistema', texto: 'La respuesta del DM se cortó a medias.' });
    dm.cargando = false;
    return salida;
  } catch (e) {
    dm.cargando = false;
    const code = (e && e.code) || 'upstream_error';
    if (code === 'prompt_too_large') dm.historial.splice(0, Math.ceil(dm.historial.length / 2));
    dm.error = { code, texto: TEXTOS_ERROR_DM[code] || 'Se ha perdido la conexión con el DM. Pulsa «Reintentar».', parcial: e && e.text };
    return { error: dm.error };
  } finally {
    if (DM.ctl === ctl) DM.ctl = null;
  }
}

function detenerDM() { if (DM.ctl) DM.ctl.abort(); }

let _saltarDado = null;
async function animarDado(t, etiqueta) {
  if (estado && estado.ajustes && estado.ajustes.animarDados === false) return;
  const capa = $('#capa-dado');
  if (!capa) return;
  vaciar(capa);
  const dados = t.dados.map((v, i) => {
    const elegido = t.dados.length === 1 || v === t.valor && t.dados.indexOf(t.valor) === i;
    const caja = h('div', { class: 'dado-caja' + (elegido ? ' elegido' : ' descartado') });
    caja.innerHTML = svgD20('d20') + `<span class="dado-num">${azar(20) + 1}</span>`;
    return { caja, v };
  });
  const etiquetaModo = t.modo === 'ventaja' ? 'con ventaja' : t.modo === 'desventaja' ? 'con desventaja' : '';
  capa.append(h('div', { class: 'dado-escena' }, h('div', { class: 'dado-fila' }, dados.map(d => d.caja)), h('div', { class: 'dado-etiqueta' }, etiqueta, etiquetaModo ? h('span', null, ' · ' + etiquetaModo) : null)));
  capa.hidden = false;
  let saltado = false;
  const promesaSalto = new Promise(r => { _saltarDado = () => { saltado = true; r(); }; });
  capa.onclick = () => _saltarDado && _saltarDado();
  const reducido = movimientoReducido();
  if (!reducido) {
    capa.classList.add('girando');
    for (let i = 0; i < 9 && !saltado; i++) {
      dados.forEach(d => { d.caja.querySelector('.dado-num').textContent = azar(20) + 1; });
      await Promise.race([esperar(45 + i * 9), promesaSalto]);
    }
    capa.classList.remove('girando');
  }
  dados.forEach(d => {
    d.caja.querySelector('.dado-num').textContent = d.v;
    if (d.v === 20) d.caja.classList.add('nat20');
    if (d.v === 1) d.caja.classList.add('nat1');

  capa.classList.add('asentado');
  await Promise.race([esperar(reducido ? 500 : 650), promesaSalto]);
  capa.classList.remove('asentado');
  capa.hidden = true;
  _saltarDado = null;
}

function asignacionPorClase(claseId, pool) {
  const reparto = CLASES[claseId] ? CLASES[claseId].reparto : { fue: 15, des: 14, con: 13, int: 12, sab: 10, car: 8 };
  const orden = Object.keys(reparto).sort((a, b) => reparto[b] - reparto[a]);
  const indices = pool.map((v, i) => i).sort((a, b) => pool[b] - pool[a]);

function puntosRestantes(cr) { return 27 - Object.values(cr.puntos).reduce((s, v) => s + COSTE_PUNTOS[v], 0); }

}

function validarPaso(cr, id) {
  const c = cr.clase && CLASES[cr.clase];
  switch (id) {
    case 'raza': return cr.raza ? null : 'Elige una raza.';
    case 'clase': return cr.clase ? null : 'Elige una clase.';
    case 'caracteristicas': if (cr.metodo === 'tirada' && !cr.tirado) return 'Tira los dados primero.'; if (cr.metodo === 'puntos' && puntosRestantes(cr) < 0) return 'Te has pasado de puntos.'; return null;
    case 'trasfondo': {
      if (!cr.trasfondo) return 'Elige un trasfondo.';
      if (cr.habilidades.length !== c.habilidades.elegir) return `Elige ${c.habilidades.elegir} habilidades de clase.`;
      if (c.pericia && cr.pericia.length !== c.pericia) return `Elige ${c.pericia} habilidades para tu pericia.`;
      if (c.estilos && c.estiloNivel === 1 && !cr.estilo) return 'Elige un estilo de combate.';
      if (cr.clase === 'explorador' && !cr.enemigo) return 'Elige tu enemigo predilecto.';
      return null;
    }
    case 'magia': {
      const l = c.lanzamiento;
      if (cr.trucos.length !== (l.trucos[0] || 0)) return `Elige ${l.trucos[0]} trucos.`;
      if (l.tipo === 'conocidos' && cr.conjuros.length !== (l.conocidos[0] || 0)) return `Elige ${l.conocidos[0]} conjuros.`;
      return null;
    }

      if (cr.modo === 'dm' && !DM.sample) return 'El DM con IA no está disponible aquí.';
      if (cr.modo === 'dm' && cr.campana === 'libre' && cr.premisa.trim().length < 10) return 'Escribe una premisa para tu aventura.';

function heroeAleatorio() {
  const cr = nuevaCreacion();
  cr.raza = elegir(Object.keys(RAZAS));
  cr.clase = elegir(Object.keys(CLASES));
  cr.asign = asignacionPorClase(cr.clase, cr.pool);
  cr.trasfondo = elegir(Object.keys(TRASFONDOS));
  cr.linaje = elegir(Object.keys(LINAJES_DRACONIDOS));
  const c = CLASES[cr.clase];
  const yaTiene = new Set([...TRASFONDOS[cr.trasfondo].habilidades, ...(RAZAS[cr.raza].habilidades || [])]);
  cr.habilidades = barajar(c.habilidades.de.filter(x => !yaTiene.has(x))).slice(0, c.habilidades.elegir);
  if (c.pericia) cr.pericia = barajar([...cr.habilidades, ...yaTiene]).slice(0, c.pericia);
  if (c.estilos && c.estiloNivel === 1) cr.estilo = elegir(c.estilos);
  if (cr.clase === 'explorador') cr.enemigo = elegir(Object.keys(TIPOS_ENEMIGO_PREDILECTO));
  if (necesitaMagia(cr)) {
    const l = c.lanzamiento;
    const trucosOp = Object.keys(CONJUROS).filter(id => CONJUROS[id].nivel === 0 && CONJUROS[id].clases.includes(cr.clase));
    const conDanio = trucosOp.filter(id => CONJUROS[id].modo !== 'narrativo');
    cr.trucos = barajar(conDanio).slice(0, Math.min(1, conDanio.length));
    cr.trucos = cr.trucos.concat(barajar(trucosOp.filter(id => !cr.trucos.includes(id))).slice(0, (l.trucos[0] || 0) - cr.trucos.length));
    if (l.tipo === 'conocidos') {
      const op = Object.keys(CONJUROS).filter(id => CONJUROS[id].nivel === 1 && CONJUROS[id].clases.includes(cr.clase));
      const utiles = op.filter(id => CONJUROS[id].modo !== 'narrativo');
      cr.conjuros = barajar(utiles).slice(0, l.conocidos[0] || 0);
    }
  }
  cr.nombre = elegir(NOMBRES_SUGERIDOS);
  cr.paso = pasosVisibles(cr).length - 1;
  return cr;
}

      const capa = $('#capa-modal .modal-cuerpo');
      if (!capa) return;

          h('button', { class: 'btn' + (typeof eleccion.pg === 'number' ? ' activo' : ''), disabled: pgTirado !== null, onclick: () => { pgTirado = dado(clase.dado); eleccion.pg = pgTirado; registrarTirada(`Subida de nivel: d${clase.dado} = ${pgTirado}`, ''); pintar(); } }, pgTirado !== null ? `Tirada: ${pgTirado} ${signo(conMod)} = ${Math.max(1, pgTirado + conMod)} PG` : `Tirar d${clase.dado}`))),

      nuevo === 5 ? h('p', { class: 'nota' }, 'Tu bono de competencia sube a +3.') : null,

    abrirModal({
      titulo: `Nivel ${nuevo}`, cerrable: false, clase: 'modal-ancho', cuerpo: cuerpo(),
      acciones: [{ texto: 'Subir de nivel', clase: 'btn-primario', deshabilitado: !valido(), onClick: () => {

        subirNivel(hr, eleccion);

        aviso(`¡Nivel ${hr.nivel}!`, 'critico');

    }).then(v => resolver(!!v));
  });
}

async function accionDM(mensaje, op = {}) {
  const dm = estado.dm;
  if (!dm || dm.cargando) return;
  if (!op.oculto) dm.vista.push({ tipo: 'jugador', texto: mensaje });
  dm.opciones = []; dm.borrador = ''; dm.error = null;
  UI.streaming = '';
  const promesa = enviarAlDM(mensaje, txt => { UI.streaming = txt; const el = $('#dm-stream'); if (el) { el.innerHTML = textoEnriquecido(txt); const p = $('.pensando'); if (p) p.remove(); const l = $('#dm-log'); if (l) l.scrollTop = l.scrollHeight; } });
  renderJuego();
  const r = await promesa;
  UI.streaming = '';
  if (r.error && r.error.code === 'cancelled' && !op.oculto) {
    const ult = dm.vista[dm.vista.length - 1];
    if (ult && ult.tipo === 'jugador' && ult.texto === mensaje) { dm.vista.pop(); dm.borrador = mensaje; }
    dm.error = null;
  }
  renderJuego();
  if (r.error) return;
  if (r.descansoCorto) await modalDescansoCorto(lineas => { if (lineas.length) dm.notas.push('Durante el descanso: ' + lineas.join('; ') + '.'); });
  if (r.subida) await flujoSubidaNivel();
  if (dm.fin === 'victoria' && !dm.finMostrado) { dm.finMostrado = true; mostrarVictoriaCampana(); }
  guardar();
}

function reintentarDM() {
  const dm = estado.dm;
  if (!dm.ultimoMensaje) return;
  dm.error = null;
  const m = dm.ultimoMensaje;
  accionDM(m, { oculto: true });
}

async function abrirPermisos() {

  aviso('Abre el menú Permisos del artefacto para permitir el uso de Claude.');
}

function mapaMazmorra(mini) {
  const mz = estado.mazmorra;
  const salas = Object.values(mz.salas);
  const actual = salaActual();
  const vecinas = new Set(actual.conexiones);
  const conocidas = new Set();
  salas.forEach(s => { if (s.visitada || mz.mapaRevelado) conocidas.add(s.id); if (s.visitada) s.conexiones.forEach(c => conocidas.add(c)); });
  const celdas = [];
  for (let y = 0; y < MAPA_H; y++) for (let x = 0; x < MAPA_W; x++) {
    const s = salas.find(q => q.x === x && q.y === y);
    if (!s || !conocidas.has(s.id)) { celdas.push(h('div', { class: 'mz-celda vacia' })); continue; }
    const puertas = DIRECCIONES.map(d => { const o = salas.find(q => q.x === x + d.dx && q.y === y + d.dy); return o && s.conexiones.includes(o.id) ? d.nombre : null; }).filter(Boolean);
    const esActual = s.id === actual.id;
    const mover = !mini && vecinas.has(s.id) && puedeMoverse();
    const tipoVisible = s.visitada || (mz.mapaRevelado && s.tipo === 'jefe') ? s.tipo : null;
    const contenido = [h('span', { class: 'mz-etq' }, tipoVisible ? ETIQUETA_SALA[tipoVisible] : '?')];
    if (esActual) contenido.push(h('span', { class: 'mz-ficha', 'aria-label': 'Estás aquí' }));
    const clase = 'mz-celda sala ' + (s.visitada ? 'visitada ' : 'oculta ') + (tipoVisible ? 'tipo-' + tipoVisible + ' ' : '') + (s.resuelta ? 'resuelta ' : '') + (esActual ? 'actual ' : '') + (mover ? 'accesible ' : '') + puertas.map(p => 'p-' + p).join(' ');
    celdas.push(mover
      ? h('button', { class: clase, 'aria-label': `Ir al ${direccionHacia(actual, s)} (${tipoVisible ? ETIQUETA_SALA[tipoVisible] : 'sala desconocida'})`, onclick: () => moverMazmorra(s.id) }, contenido)
      : h('div', { class: clase, title: tipoVisible ? ETIQUETA_SALA[tipoVisible] : 'Sin explorar' }, contenido));
  }
  return h('div', { class: 'mz-mapa' + (mini ? ' mini' : ''), style: { gridTemplateColumns: `repeat(${MAPA_W}, 1fr)` } }, celdas);
}

function turnoDelHeroe() { const c = estado.combate; return c && c.esperandoJugador && c.orden[c.turno] === 'heroe' && !c.resultado; }

function cancelarModo() { UI.modoCombate = null; UI.previa = null; UI.destino = null; UI.menuAbierto = null; }

// Celdas iluminadas según el modo
function calcularResaltado() {
  const c = estado.combate, h = estado.heroe, H = c.ents.heroe;
  const res = { alcanzable: new Set(), objetivo: new Set(), area: new Set(), ruta: new Set(), libre: new Set() };
  if (!turnoDelHeroe()) return res;
  const k = (x, y) => x + ',' + y;
  const m = UI.modoCombate;
  if (!m) {
    if (c.t.mov > 0) {
      const { d } = mapaDistancias(c, H, { bando: 'heroe' });
      for (let y = 0; y < ALTO_MAPA; y++) for (let x = 0; x < ANCHO_MAPA; x++) if (d[y][x] > 0 && d[y][x] <= c.t.mov && celdaLibre(c, x, y)) res.alcanzable.add(k(x, y));
    }
    const dest = UI.destino || UI.previa;
    if (dest && res.alcanzable.has(k(dest.x, dest.y))) { const r = rutaHeroe(dest.x, dest.y); if (r) r.ruta.forEach(p => res.ruta.add(k(p.x, p.y))); }
    return res;
  }
  const objetivos = objetivosModo(m);
  objetivos.forEach(e => res.objetivo.add(k(e.x, e.y)));
  const area = areaModo(m);
  if (area) {
    if (area.objetivo === 'punto' || area.objetivo === 'casilla_libre') {
      for (let y = 0; y < ALTO_MAPA; y++) for (let x = 0; x < ANCHO_MAPA; x++) if (dist(H, { x, y }) <= area.alcance && (area.objetivo === 'punto' || celdaLibre(c, x, y))) res.libre.add(k(x, y));
    }
    const p = UI.previa;
    if (area.forma && (area.objetivo === 'yo' || (p && (area.objetivo === 'direccion' || res.libre.has(k(p.x, p.y)))))) {
      celdasArea(c, area.forma, H, area.objetivo === 'yo' ? H : p).forEach(q => res.area.add(k(q.x, q.y)));
    }
  }
  return res;
}

// Enemigos válidos como objetivo del modo actual
function objetivosModo(m) {
  const c = estado.combate, H = c.ents.heroe;
  if (m.tipo === 'ataque') { const perfil = ataquesDisponibles(estado.heroe).find(a => a.uid === m.uid); return perfil ? objetivosValidosArma(perfil) : []; }
  const alcance = m.alcance != null ? m.alcance : 1;
  if (m.objetivoTipo === 'enemigo') return enemigosVivos().filter(e => dist(H, e) <= alcance);
  if (m.objetivoTipo === 'enemigo_adyacente' || m.objetivoTipo === 'arma_cuerpo') return enemigosVivos().filter(e => dist(H, e) <= 1);
  return [];
}
function areaModo(m) {
  if (!m.objetivoTipo || !['punto', 'direccion', 'yo', 'casilla_libre'].includes(m.objetivoTipo)) return null;
  return { forma: m.area || null, objetivo: m.objetivoTipo, alcance: m.alcance || 0 };
}

function aplicarPrevia() {
  if (!estado || !estado.combate) return;
  const res = calcularResaltado();
  $$('.cmb-celda').forEach(el => {
    const kk = el.dataset.k;
    el.classList.toggle('en-area', res.area.has(kk));
    el.classList.toggle('en-ruta', res.ruta.has(kk));
  });
}

async function trasAccion() {
  UI.modoCombate = null; UI.previa = null; UI.destino = null; UI.menuAbierto = null;
  await despuesAccionHeroe();
  renderJuego();
}

async function clicCelda(x, y) {
  const c = estado.combate;
  if (!turnoDelHeroe() || UI.ocupado) return;
  const ent = entEn(c, x, y);
  const m = UI.modoCombate;
  const kk = x + ',' + y;
  const res = calcularResaltado();
  if (!m) {
    if (ent && ent.id !== 'heroe') { UI.seleccion = ent.id; UI.destino = null; renderJuego(); return; }
    if (res.alcanzable.has(kk)) {
      if (UI.destino && UI.destino.x === x && UI.destino.y === y) { await ejecutar(() => moverHeroe(x, y)); return; }
      UI.destino = { x, y }; UI.previa = null; renderJuego(); return;
    }
    UI.destino = null; renderJuego();
    return;
  }
  if (m.tipo === 'ataque') { if (ent && res.objetivo.has(kk)) await ejecutar(() => heroeAtaca(m.uid, ent.id)); return; }
  if (['enemigo', 'enemigo_adyacente', 'arma_cuerpo'].includes(m.objetivoTipo)) { if (ent && res.objetivo.has(kk)) await ejecutar(() => m.ejecutar(ent.id)); return; }
  if (m.objetivoTipo === 'punto' || m.objetivoTipo === 'casilla_libre' || m.objetivoTipo === 'direccion') {
    if (m.objetivoTipo !== 'direccion' && !res.libre.has(kk)) return;
    if (m.objetivoTipo === 'direccion' && x === c.ents.heroe.x && y === c.ents.heroe.y) return;
    const confirmado = UI.previa && UI.previa.x === x && UI.previa.y === y && UI.previaConfirmable;
    if (!confirmado) { UI.previa = { x, y }; UI.previaConfirmable = true; aplicarPrevia(); actualizarAyudaModo(); return; }
    await ejecutar(() => m.ejecutar({ x, y }));
  }
}

}

function prepararConjuro(idConjuro, nivel, uidObjeto) {
  const c = estado.combate;
  const cj = CONJUROS[conjuroBase(idConjuro)];
  cancelarModo();
  const lanzar = (objetivo) => uidObjeto ? usarObjetoCombate(uidObjeto, objetivo) : lanzarConjuro(idConjuro, nivel, objetivo);
  const lanzarComprobando = async (objetivo) => { const r = await lanzar(objetivo); if (r && r.error) aviso(r.error, 'malo'); };
  if (cj.objetivo === 'yo' && !cj.area || cj.objetivo === 'yo' && cj.area && cj.area.forma === 'radio_yo' && cj.modo === 'efecto') { ejecutar(() => lanzarComprobando(null)); return; }
  const alcance = cj.objetivo === 'casilla_libre' || cj.objetivo === 'punto' || cj.objetivo === 'enemigo' ? cj.alcance : 0;
  UI.modoCombate = { nombre: cj.nombre + (nivel > cj.nivel && cj.nivel > 0 ? ` (nivel ${nivel})` : ''), objetivoTipo: cj.objetivo, alcance, area: cj.area || null, ejecutar: lanzarComprobando };
  if (cj.objetivo === 'yo') { UI.previa = { x: c.ents.heroe.x, y: c.ents.heroe.y }; UI.previaConfirmable = true; UI.modoCombate.objetivoTipo = 'yo'; UI.modoCombate.confirmarYo = true; }
  renderJuego();
  if (cj.objetivo === 'yo') {
    // Área a tu alrededor: confirmar con un botón
    const a = $('#ayuda-modo');
    if (a) a.append(h('div', { class: 'fila-botones' }, h('button', { class: 'btn btn-primario', onclick: () => ejecutar(() => lanzarComprobando(null)) }, 'Lanzar')));
  }
}

function prepararRasgo(r) {
  cancelarModo();
  if (!r.objetivo) { ejecutar(() => usarRasgo(r.id)); return; }
  if (r.objetivo === 'direccion') { UI.modoCombate = { nombre: r.nombre, objetivoTipo: 'direccion', area: r.area, alcance: 0, ejecutar: (p) => usarRasgo(r.id, p) }; renderJuego(); return; }
  const alcance = r.objetivo === 'enemigo' ? (r.id === 'arma_espiritual' ? 12 : 24) : 1;
  UI.modoCombate = { nombre: r.nombre, objetivoTipo: r.objetivo === 'enemigo' ? 'enemigo' : 'enemigo_adyacente', alcance, ejecutar: (id) => usarRasgo(r.id, id) };
  renderJuego();
}

// ── main.js ──
// ─── Arranque ───

function arrancar(datos) {
  const previo = datos && datos.estado;
  if (previo && previo.version === VERSION_GUARDADO && previo.heroe && previo.pantalla === 'juego') {
    estado = previo;
    restaurarPartida();
  } else {
    estado = estadoBase();
    if (previo && previo.ajustes) estado.ajustes = previo.ajustes;
    render();
  }
  comprobarDM().then(() => { if (estado && (estado.pantalla === 'creacion' || estado.pantalla === 'titulo')) render(); });
  // Altura real de la barra superior para colocar las pestañas móviles debajo
  const medir = () => { const b = document.querySelector('.barra-sup'); if (b) document.documentElement.style.setProperty('--alto-barra', b.offsetHeight + 'px'); };
  new MutationObserver(medir).observe(document.getElementById('app'), { childList: true });
  window.addEventListener('resize', medir);
}

// Acceso para pruebas automáticas: solo con #depurar en la dirección
if (typeof location !== 'undefined' && location.hash === '#depurar') {
  window.__dyd = { get estado() { return estado; }, render, renderJuego, empezarCombate, flujoSubidaNivel };
}

(function () {
  const hot = typeof window !== 'undefined' && window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ estado })); } catch (e) { /* sin recarga en caliente */ }
  const iniciar = (d) => arrancar(d || {});
  if (hot && typeof hot.ready === 'function') hot.ready(iniciar);
  else iniciar(hot && hot.data);
})();

})();
</script>
